{sec:16, type:'section', kicker:'Activity', art:'c', tone:'tranquil',
 title:`Offering Hope for Wellness`, line:`Take the responder's role in a call and offer a culturally specific service without losing the connection.`},

{sec:16, type:'prose', title:'How this activity works', blocks:[
  {p:`In this activity, you are the responder. A caller has been talking with you for about ten minutes about how difficult the past year has been since moving to a new city for work. Their safety has already been explored.`, lede:true},
  {p:`As the interaction unfolds:`},
  {ul:[
    `Pay attention to what they tell you about the kinds of support and connection that have mattered to them before`,
    `Make informed choices about how to offer a culturally specific service while preserving the connection`
  ]},
  {note:`Your responses are not scored. This activity focuses on how you offer a resource. In practice, whether and when to offer a resource depends on the person's needs and safety, as well as the standard operating procedures.`},
  {panel:{cls:'blue', p:`You can start the call again at the end to follow another path.`}}
]},

{sec:17, type:'prose', title:'The moment', blocks:[
  {audio:{label:`The moment`, ch:'Voice call', lines:[
    {spk:'Caller', meta:`(quietly)`, t:`It's been hard since I moved here for the job. Back home, when things got like this, I'd go sit with my auntie, or there was an Elder I could talk to. I'm First Nations, and honestly the only time I've felt like myself this year was the two weeks I was home. Here there's nobody who gets that.`}
  ]}}
]},

{sec:17, type:'convo', ch:'Voice call',
 audio:true, audioLabel:`Your response and what follows`,
 start:'name', restart:`Start the call again`,
 nodes:{

  name:{
    prompt:`How do you respond?`,
    hint:`Notice how each response shapes what happens next.`,
    options:[
     {k:'A', t:`"Okay. So there's actually a helpline for Indigenous people called Hope for Wellness. Let me give you the number. It's 1-855-242-3310. They'll be better able to help you with the cultural side of things."`,
      reply:[
       {spk:'Caller', meta:`(pause)`, t:`Oh. Okay.`},
       {spk:'Caller', meta:`(flat)`, t:`So I should call them instead. Sure. I'll write it down.`},
       {sys:`the openness of a moment ago is gone`}
      ],
      next:'recover1'},
     {k:'B', t:`"That sounds really isolating. What's it like at work? Is there anyone there you talk to?"`,
      reply:[
       {spk:'Caller', t:`Not really. Everyone's fine. They're just not from anywhere near where I'm from.`},
       {spk:'Caller', meta:`(quieter)`, t:`It's fine.`},
       {sys:`the thread about home does not come back`}
      ],
      next:'recover1'},
     {k:'C', t:`"It sounds like being home, with your auntie and with someone who understands where you come from, is where you feel most like yourself. There's a service called the Hope for Wellness Helpline, with counsellors who work specifically with First Nations, Inuit, and Métis people. Would you like to hear a little about it, or would you rather keep talking here for now?"`,
      reply:[
       {spk:'Caller', meta:`(a breath)`, t:`Yeah. Yeah, I'd like to hear about it. I didn't know there was anything like that.`}
      ],
      cta:`Continue the call`, next:'access'}
    ]
  },

  recover1:{
    audioLabel:`The responder goes back to what the caller said`,
    lines:[
     {spk:'Responder', t:`I want to go back to something you said. You talked about your auntie and the Elder back home, and feeling like yourself there. There's a service called the Hope for Wellness Helpline, with counsellors who work specifically with First Nations, Inuit, and Métis people. Would it be okay if I told you a little about it?`},
     {spk:'Caller', meta:`(pause)`, t:`Okay. Yeah. Go ahead.`}
    ],
    cta:`Continue the call`, next:'access'
  },

  access:{
    audioLabel:`The caller asks how it works`,
    lines:[
     {spk:'Caller', t:`So how does it work? Do I have to go somewhere?`}
    ],
    prompt:`What do you say?`,
    hint:`Notice how each response affects the caller's choices about what happens next.`,
    options:[
     {k:'A', t:`"No, it's a phone line and an online chat, and it's open all day, every day. The number is 1-855-242-3310, and the chat is at hopeforwellness.ca. There's support in English and French, and you can ask for a counsellor who speaks Cree, Ojibway, or Inuktitut. I'll let you go now so you can give them a call."`,
      reply:[
       {spk:'Caller', t:`Oh.`},

/* ---------- blocks ---------- */
function blocks(list, root){
  list.forEach(b=>{
    if(b.p) root.append(el('p', [b.lede?'lede':'', b.indent?'indent':''].join(' ').trim()||null, H(b.p)));
    else if(b.instr) root.append(el('p','instr','<em>'+H(b.instr)+'</em>'));
    else if(b.h3) root.append(el('h3', null, H(b.h3)));
    else if(b.ul){ const u=el('ul','brand'); b.ul.forEach(t=>u.append(el('li',null,H(t)))); root.append(u); }
    else if(b.ol){ const o=el('ol','brand'); b.ol.forEach(t=>o.append(el('li',null,H(t)))); root.append(o); }
    else if(b.panel) root.append(el('div','panel '+(b.panel.cls||''), (b.panel.h?'<h4>'+b.panel.h+'</h4>':'')+'<p>'+H(b.panel.p)+'</p>'));
    else if(b.note) root.append(el('div','note','<p>'+H(b.note)+'</p>'));
    else if(b.key) root.append(el('div','keycall', b.key.map(t=>'<p>'+H(t)+'</p>').join('')));
    else if(b.cards) root.append(cardsEl(b.cards));
    else if(b.flip) root.append(flipEl(b.flip));
    else if(b.tabs) root.append(tabsEl(b.tabs, b.select));
    else if(b.acc) root.append(accEl(b.acc));
    else if(b.reveal) root.append(revealEl(b.reveal));
    else if(b.table) root.append(tableEl(b.table));
    else if(b.thread) root.append(threadEl(b.thread));
    else if(b.audio) root.append(audioEl({label:b.audio.label, open:b.audio.open, src:b.audio.src,
      transcript: threadEl({ch:b.audio.ch||'Voice call', lines:b.audio.lines})}));
  });
}
function cardsEl(c){

function flipEl(items){
  const d=el('div','flips');

  if(items.length%3!==0 && items.length%2===0) d.dataset.cols='2';
  items.forEach((i,ix)=>{
    const c=el('div','flip','<button class="inner" aria-pressed="false">'+
      '<span class="face f"><span class="n">'+String(ix+1).padStart(2,'0')+'</span><span class="t">'+H(i.front)+'</span><span class="hint">Tap to turn</span></span>'+
      '<span class="face b"><span class="hint">'+H(i.front)+'</span><p>'+H(i.back)+'</p><span class="hint">Tap to turn back</span></span></button>');
    const btn=c.querySelector('.inner');
    btn.onclick=()=>{ c.classList.toggle('on'); btn.setAttribute('aria-pressed', c.classList.contains('on')); };
    d.append(c);
  });

}
function tabsEl(items, sel){
  const d=el('div','tabs'), list=el('div','tablist'), panel=el('div','tabpanel');
  /* `select` opens the tab that the learner's earlier answers call for:
     {ids:['q1','q2'], same:1, diff:0} compares the picks recorded for those
     question ids. With any of them unanswered the first tab opens. */
  let first=0;
  if(sel && sel.ids && sel.ids.every(id=>state.picks[id]!=null)){
    const ks=sel.ids.map(id=>state.picks[id]);
    first = ks.every(k=>k===ks[0]) ? (sel.same??0) : (sel.diff??0);
  }
  list.setAttribute('role','tablist'); panel.setAttribute('role','tabpanel');
  const show=n=>{ [...list.children].forEach((b,i)=>b.setAttribute('aria-selected', i===n));
    const it=items[n]; panel.innerHTML=(it.h?'<h4>'+H(it.h)+'</h4>':'')+'<p>'+H(it.p)+'</p>'; };
  items.forEach((it,i)=>{ const b=el('button',null,it.label); b.setAttribute('role','tab'); b.onclick=()=>show(i); list.append(b); });
  d.append(list,panel); show(first); return d;
}

function audioEl(cfg){
  const w=el('div','audio'+(cfg.src?' live':''));
  w.innerHTML='<div class="bar">'+(cfg.src?'<button class="play" type="button" aria-label="Play"></button>':'<span class="play"></span>')+
    '<div class="meta"><span class="ttl">'+cfg.label+'</span>'+

    '<div class="wave">'+Array.from({length:38},(_,i)=>'<span style="height:'+(18+Math.abs(Math.sin(i*1.15))*62)+'%"></span>').join('')+'</div></div>';
  if(cfg.src){
    /* A real clip: the play button and the bars work as a small player.
       `src` is a data URI or URL supplied by the content file. */
    const a=new Audio(cfg.src), play=w.querySelector('.play'), sub=w.querySelector('.sub'),
          bars=[...w.querySelectorAll('.wave span')], wave=w.querySelector('.wave');
    const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
    a.addEventListener('loadedmetadata',()=>{ sub.textContent=fmt(a.duration); });
    a.addEventListener('timeupdate',()=>{
      const f=a.duration?a.currentTime/a.duration:0;
      bars.forEach((b,i)=>b.classList.toggle('on', i/bars.length<f));
      sub.textContent=fmt(a.currentTime)+' / '+fmt(a.duration||0);
    });
    const setPlaying=on=>{ play.classList.toggle('pause',on); play.setAttribute('aria-label', on?'Pause':'Play'); };
    a.addEventListener('play',()=>setPlaying(true)); a.addEventListener('pause',()=>setPlaying(false));
    a.addEventListener('ended',()=>{ setPlaying(false); bars.forEach(b=>b.classList.remove('on')); sub.textContent=fmt(a.duration); });
    play.onclick=()=>{ a.paused ? a.play() : a.pause(); };
    wave.onclick=e=>{ const r=wave.getBoundingClientRect(); if(a.duration) a.currentTime=((e.clientX-r.left)/r.width)*a.duration; };
  }
  const btn=el('button','transbtn', (cfg.open?'Hide transcript':'Show transcript'));
  const slot=el('div');
  slot.style.display = cfg.open ? '' : 'none';
  slot.append(cfg.transcript);
  btn.onclick=()=>{
    const on = slot.style.display==='none';
    slot.style.display = on ? '' : 'none';
    btn.textContent = on ? 'Hide transcript' : 'Show transcript';
    btn.setAttribute('aria-expanded', on);
  };
  btn.setAttribute('aria-expanded', !!cfg.open);
  w.append(btn, slot);
  return w;
}

function threadEl(t){
  const isText = t.ch==='Text';
  const w=el('div','thread', t.noCh?'':'<p class="ch">'+(isText?'Text conversation':'Voice call')+'</p>');
  t.lines.forEach(l=>w.append(lineEl(l,isText)));

function lineEl(l, isText){
  if(l.sys){
    const wrap=el('div');
    if(l.typing) wrap.append(el('div','typing','<i></i><i></i><i></i>'));
    wrap.append(el('p','sysline','('+l.sys+')'));
    return wrap;
  }
  const node = isText
    ? el('div','bubble '+(l.who==='us'?'us':'them'),'<span class="spk">'+(l.spk||'')+'</span>'+H(l.t))
    : el('div','line','<span class="spk">'+(l.spk||'')+'</span>'+(l.meta?'<span class="meta">'+l.meta+' </span>':'')+H(l.t));
  if(!l.ann) return node;
  /* Annotations sit under their line, hidden to start. Each <mark> in the
     line toggles its own annotation (the nth mark opens the nth one); a line
     with no marks is revealed by a `write` screen with `annotate:true`. */
  const anns=[].concat(l.ann), labels=[].concat(l.annLabel||'Annotation');
  const wrap=el('div'); wrap.append(node);
  const boxes=anns.map((a,i)=>{ const b=el('div','ann',
    (labels[i%labels.length]?'<span class="spk">'+labels[i%labels.length]+'</span>':'')+H(a)); wrap.append(b); return b; });
  node.querySelectorAll('mark').forEach((m,i)=>{
    const box=boxes[Math.min(i,boxes.length-1)];
    m.setAttribute('role','button'); m.tabIndex=0; m.setAttribute('aria-expanded','false');
    const flip=()=>{ const on=box.classList.toggle('on'); m.classList.toggle('on',on); m.setAttribute('aria-expanded',on); };
    m.onclick=flip; m.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(); } };
  });
  return wrap;
}

/* ---------- table ---------- */
/* `cols` are the column headings; the first is the row-label column and may be
   empty. Each row is [label, cell, cell, …]. Below 720px the headings are
   dropped and each cell carries its column name as a small label. */
function tableEl(t){
  const outer=el('div');
  const w=el('div','tbl');
  const head='<thead><tr>'+t.cols.map(c=>'<th scope="col">'+H(c)+'</th>').join('')+'</tr></thead>';
  const rowHtml=r=>'<tr>'+r.map((cell,i)=>
    i===0 ? '<th scope="row">'+H(cell)+'</th>'
          : '<td data-lbl="'+(t.cols[i]||'')+'">'+H(cell)+'</td>'
  ).join('')+'</tr>';

  /* revealRows: the table starts empty and fills a row at a time */
  if(t.revealRows){
    w.innerHTML='<table>'+head+'<tbody></tbody></table>';
    const body=w.querySelector('tbody');
    const row=el('div'); row.style.margin='0 0 1rem';
    const btn=el('button','btn yellow small', t.revealCta||'Reveal the first row');
    let i=0;
    btn.onclick=()=>{
      body.insertAdjacentHTML('beforeend', rowHtml(t.rows[i])); i++;
      if(i>=t.rows.length) row.remove(); else btn.textContent=t.revealMore||'Reveal the next';
    };
    row.append(btn); outer.append(w,row);
    return outer;
  }

  w.innerHTML='<table>'+head+'<tbody>'+t.rows.map(rowHtml).join('')+'</tbody></table>';
  outer.append(w);
  return outer;
}

/* ---------- branching conversation ---------- */
/* Runs a scenario as a state machine. Each node contributes its own lines to a
   running transcript, then offers a choice; every option names the node it
   leads to, so learners on different paths see different conversations. Nodes
   without options are scripted beats that continue to `next`; nodes with
   `done` end the scenario. Only the path taken is shown.
   An option marked `deferFb` holds its node's feedback back until after the
   beat it leads to, so a recovery exchange plays before the teaching point. */
function convoEl(cfg){
  const wrap=el('div');
  const stream=el('div');
  const foot=el('div');
  wrap.append(stream, foot);
  const isText = cfg.ch==='Text';
  let said=false, pending=null;

  /* Voice scenarios stay audio-first: each exchange gets its own placeholder,
     with the transcript collapsed unless the scenario asks for it open. */
  const turnEl=(lines,label)=>{
    const th=threadEl({ch:cfg.ch, noCh:said||cfg.audio, lines});
    if(!cfg.audio) return th;
    return audioEl({label:label||'The call continues', open:cfg.transcripts==='open', transcript:th});
  };

  const fbEl=(src)=>{
    if(!src || (!src.fb && !src.fbBlocks)) return;
    const fb=el('div','fb info'); fb.setAttribute('role','status');
    if(src.fb) fb.append(el('p',null,H(src.fb)));
    if(src.fbBlocks) blocks(src.fbBlocks, fb);
    stream.append(fb);
  };

  const runNode=(id)=>{
    const n=cfg.nodes[id];
    if(!n) return;
    if(n.blocks) blocks(n.blocks, stream);
    if(n.lines && n.lines.length){ stream.append(turnEl(n.lines, n.audioLabel)); said=true; }
    if(pending){ fbEl(pending); pending=null; }

    if(n.done){
      if(cfg.restart){
        const again=el('button','btn ghost small', cfg.restart);
        again.onclick=()=>{ stream.innerHTML=''; foot.innerHTML=''; said=false; pending=null; runNode(cfg.start); };
        foot.innerHTML=''; foot.append(again);
      }
      return;
    }

    if(!n.options){
      const on=el('button','btn yellow small', n.cta||'Continue the call');
      on.style.margin='0 0 1rem';
      on.onclick=()=>{ on.remove(); runNode(n.next); };
      stream.append(on);
      return;
    }

    const q=el('div','check','<p class="prompt">'+H(n.prompt)+'</p>'+
      (n.hint?'<p class="hint">'+H(n.hint)+'</p>':''));
    const list=el('div','opts'); q.append(list);
    stream.append(q);

    n.options.forEach(o=>{
      const b=el('button','opt','<span class="key">'+o.k+'</span><span>'+H(o.t)+'</span>');
      b.onclick=()=>{
        list.querySelectorAll('button').forEach(x=>{
          x.disabled=true;
          if(x!==b) x.dataset.outcome='dim';
        });
        b.dataset.picked='1';
        const turn=[{who:'us', spk:'Responder', t:o.t.replace(/^"|"$/g,'')}]
          .concat((o.reply||[]).map(r=>({...r, who:'them'})));
        stream.append(turnEl(turn, cfg.audioLabel||'Your response and what follows'));
        said=true;
        if(o.deferFb) pending={fb:n.fb, fbBlocks:n.fbBlocks};
        else fbEl(n);
        const on=el('button','btn yellow small', o.cta||'Continue the call');
        on.style.margin='.9rem 0 1rem';
        on.onclick=()=>{ on.remove(); runNode(o.next); };
        stream.append(on);
      };
      list.append(b);
    });
  };

  runNode(cfg.start);
  return wrap;
}

/* ---------- response step ---------- */
/* One "choose what you would say" step: options, the reply each one draws,
   and a shared closing note once a response has been chosen. Used on its own
   (`respond` screens) and as step 2 of a vignette. */
function respondEl(cfg, isText){
  const wrap=el('div');
  const q=el('div','check','<p class="prompt">'+H(cfg.prompt)+'</p>'+
    (cfg.hint?'<p class="hint">'+H(cfg.hint)+'</p>':''));
  const list=el('div','opts'); q.append(list);
  const out=el('div'), closing=el('div');
  let chosen=null, tried=[];
  const paint=()=>{
    list.innerHTML=''; out.innerHTML=''; closing.innerHTML='';
    cfg.options.filter(o=>!chosen||o.k===chosen).forEach(o=>{
      const b=el('button','opt','<span class="key">'+o.k+'</span><span>'+H(o.t)+'</span>');
      if(chosen){ b.disabled=true; b.dataset.picked='1'; }
      b.onclick=()=>{ chosen=o.k; tried.push(o.k); paint(); };
      list.append(b);
    });
    if(chosen){
      const o=cfg.options.find(x=>x.k===chosen);
      const cont=el('div','thread','<p class="ch">'+(isText?'How the thread continues':'How the call continues')+'</p>');
      cont.append(lineEl({who:'us',spk:'Responder',t:o.t.replace(/^"|"$/g,'')},isText));
      o.reply.forEach(r=>cont.append(lineEl({...r,who:'them'},isText)));
      if(isText) out.append(cont);
      else out.append(audioEl({label:cfg.audioLabel||'Your response and what follows', transcript:cont}));
      if(tried.length<cfg.options.length){
        const again=el('button','btn yellow small', cfg.againLabel||'Try another response');
        again.style.margin='0 0 1rem'; again.onclick=()=>{ chosen=null; paint(); };
        out.append(again);
      }
      const fb=el('div','fb info'); fb.setAttribute('role','status');
      if(cfg.closing) fb.append(el('p',null,H(cfg.closing)));
      if(cfg.closingBlocks) blocks(cfg.closingBlocks, fb);
      closing.append(fb);
    }
  };
  paint();
  wrap.append(q,out,closing);
  return wrap;
}

/* ---------- knowledge check ---------- */
function questionEl(q, opts){
  const box=el('div','check',
    '<p class="prompt'+(q.ask?' scenario':'')+'">'+H(q.prompt)+'</p>'+
    (q.ask?'<p class="prompt ask">'+H(q.ask)+'</p>':'')+
    (q.hint?'<p class="hint">'+H(q.hint)+'</p>':''));
  const list=el('div','opts'); box.append(list);
  const slot=el('div'); box.append(slot);
  let picked=null;
  const paint=()=>{
    list.innerHTML=''; slot.innerHTML='';
    const gotIt = picked && (q.shared || (q.options.find(o=>o.k===picked)||{}).correct);
    q.options.forEach(o=>{
      const b=el('button','opt','<span class="key">'+o.k+'</span><span>'+H(o.t)+'</span>');
      if(picked){
        b.disabled=true;
        if(picked===o.k) b.dataset.picked='1';
        if(q.shared){ if(q.answerKey===o.k) b.dataset.outcome='info'; else if(picked!==o.k) b.dataset.outcome='dim'; }
        else if(q.oneFb){
          if(o.correct) b.dataset.outcome='correct';
          else if(picked===o.k) b.dataset.outcome='wrong';
          else b.dataset.outcome='dim';
        }
        else if(gotIt){ if(o.correct) b.dataset.outcome='correct'; else b.dataset.outcome='dim'; }
      }
      b.onclick=()=>{ picked=o.k; paint(); if(opts&&opts.onPick) opts.onPick(o.k); if(opts&&opts.onCorrect&&(q.shared||o.correct)) opts.onCorrect(); };
      list.append(b);
    });
    if(picked){
      const chosen=q.options.find(o=>o.k===picked);
      const fb=el('div'); fb.setAttribute('role','status');
      if(q.shared){ fb.className='fb info'; fb.innerHTML='<p>'+H(q.sharedFb)+'</p>'; }
      else if(q.oneFb){ fb.className='fb '+(chosen.correct?'yes':'no'); fb.innerHTML='<p>'+H(q.oneFb)+'</p>'; }
      else{
        fb.className='fb '+(chosen.correct?'yes':'no');
        fb.innerHTML='<p>'+H(chosen.fb)+'</p>';
        if(!chosen.correct){
          const again=el('button','btn ghost small','Try again'); again.style.marginTop='.8rem';
          again.onclick=()=>{ picked=null; paint(); };
          fb.append(again);
        }
      }
      slot.append(fb);
    }
  };
  paint();
  return box;
}

/* ---------- pages ---------- */
const stream=$('#stream'), hero=document.querySelector('.hero');
const PAGES = SECTIONS.map((entry,si)=>({
  si,
  name: (typeof entry==='string') ? entry : entry.name,
  /* Continuation pages carry `menu:false` so the contents list stays an
     outline of topics and activities rather than every page. */
  menu: (typeof entry==='string') ? true : entry.menu!==false,
  header: SCREENS.find(s=>s.sec===si && s.type==='section') || null,
  chunks: SCREENS.filter(s=>s.sec===si && s.type!=='section' && s.type!=='cover' && s.type!=='complete')
}));
const TOTAL = PAGES.reduce((n,p)=>n+p.chunks.length,0);
const state = { page:0, revealed: PAGES.map(()=>1), done:false, picks:{} };

function el2(tag,cls,html){ return el(tag,cls,html); }
let writeSeq=0;

function dividerEl(s){
  const d=el('section','divider rev in');
  d.dataset.tone=s.tone||'trust';
  d.innerHTML='<div class="in"><div>'+(s.num?'<p class="num">'+s.num+'</p>':'<div class="rule"></div>')+
    '<p class="kick">'+s.kicker+'</p><h2>'+H(s.title)+'</h2><p class="line">'+H(s.line)+'</p></div>'+
    '<div>'+sectionArt(s.art,s.tone)+'</div></div>';
  return d;
}

function chunkEl(s){
  const d=el('div','blk rev'); const c=el('div','col'); d.append(c);
  if(s.eyebrow) c.append(el('p','eyebrow',s.eyebrow));
  if(s.title) c.append(el('h2',null,H(s.title)));

  if(s.type==='prose'){ blocks(s.blocks,c); return d; }

  if(s.type==='mcq'){
    if(s.intro) blocks(s.intro,c);
    c.append(questionEl(s, s.id ? {onPick:k=>{ state.picks[s.id]=k; }} : undefined));
    return d;
  }

  if(s.type==='vignette'){
    const isText=s.thread.ch==='Text';
    const v=el('div','vig');
    v.append(el('div','vig-head','<div class="avatar">'+s.person.init+'</div>'+
      '<div><span class="nm">'+s.person.name+'</span><span class="sub">'+s.person.sub+'</span></div>'+
      '<span class="chip'+(isText?' blue':'')+'" style="display:none">'+s.person.tag+'</span>'));
    if(isText) v.append(threadEl(s.thread));
    else v.append(audioEl({label:'Opening moments of the call', transcript:threadEl(s.thread)}));
    v.append(el('p','step','<span class="n">1</span> What may '+s.person.name+' need first?'));
    const step2=el('div','locked');
    v.append(questionEl({prompt:s.step1.prompt, hint:s.step1.hint, options:s.step1.options},{onCorrect:()=>{
      step2.classList.remove('locked'); v.querySelector('.chip').style.display='';
    }}));
    step2.append(el('p','step','<span class="n">2</span> Choose your first response'));
    step2.append(respondEl(s.step2, isText));
    v.append(step2); c.append(v);
    return d;
  }

  if(s.type==='convo'){
    if(s.intro) blocks(s.intro,c);
    c.append(convoEl(s));
    return d;
  }

  if(s.type==='respond'){
    if(s.intro) blocks(s.intro,c);
    c.append(respondEl(s, s.ch==='Text'));
    return d;
  }

  if(s.type==='write'){
    if(s.intro) blocks(s.intro,c);
    c.append(writingEl({id:'w'+(writeSeq++), prompts:s.prompts, numbered:!!s.numbered,
      placeholder:s.placeholder||'Your answer', cta:s.cta||'Submit',
      feedbackBlocks:s.feedback, prototypeNote:s.prototypeNote, after:s.after, plainFeedback:s.plainFeedback,
      onShow: s.annotate ? ()=>c.querySelectorAll('.ann').forEach(a=>a.classList.add('on')) : null}));
    return d;
  }

  if(s.type==='video'){
    blocks(VIDEO_BLOCKS,c);
    c.append(el('div','video','<div class="frame"><span class="play"></span><span class="lbl">Responder voices &middot; video to be produced</span></div>'));
    return d;
  }

  if(s.type==='reflect'){
    blocks(REFLECT_INTRO,c);
    c.append(writingEl({id:'r', prompts:REFLECT_PROMPTS, numbered:true, cta:'Submit my reflection',
      feedback:'<p>'+H(REFLECT_FEEDBACK)+'</p>'}));
    return d;
  }

  if(s.type==='plan'){
    blocks(PLAN_INTRO,c);
    c.append(writingEl({id:'p', prompts:PLAN_PROMPTS, numbered:false, placeholder:'What would work for you?',
      cta:'Submit my plan',
      feedback:'<p>'+H(PLAN_FEEDBACK)+'</p>'+
        cardsEl({cols:1, tight:true, items:STRATEGIES.map(t=>({t}))}).outerHTML}));
    return d;
  }

  if(s.type==='refs'){ c.append(el('div','refs', REFS.map(r=>'<p>'+r+'</p>').join(''))); return d; }
  return d;
}

function endEl(){
  return el('section','end rev','<div class="sweep"></div><div class="in">'+
    '<p class="eyebrow">'+META.moduleLabel+' complete</p><h2>'+H(END.title)+'</h2>'+
    '<p>'+H(END.summary)+'</p>'+
    '<div class="panel"><h4>'+H(END.nextTitle)+'</h4><p>'+H(END.next)+'</p></div>'+
    '</div>');
}

function gateEl(){
  const p=PAGES[state.page], shown=state.revealed[state.page];
  const g=el('div','gate');
  const more = shown < p.chunks.length;
  const last = state.page===PAGES.length-1;
  const btn=el('button','btn', more ? 'Continue' : (last ? 'Finish module' : 'Continue to '+PAGES[state.page+1].name));
  btn.onclick=()=>{
    if(more){
      g.remove();
      const node=chunkEl(p.chunks[shown]);
      stream.append(node);
      state.revealed[state.page]=shown+1;
      stream.append(gateEl());
      requestAnimationFrame(()=>{ node.classList.add('in'); node.scrollIntoView({behavior:'smooth',block:'start'}); });
      progress();
    } else if(last){
      g.remove(); state.done=true;
      const e=endEl(); stream.append(e);
      requestAnimationFrame(()=>{ e.classList.add('in'); e.scrollIntoView({behavior:'smooth',block:'start'}); });
      progress();
    } else {
      goPage(state.page+1);
    }
  };
  g.append(btn);
  if(state.page>0 && !more){
    const back=el('button','back','Back to '+PAGES[state.page-1].name);
    back.onclick=()=>goPage(state.page-1);
    g.append(back);
  }
  return g;
}

function goPage(pi){
  state.page=pi;
  stream.innerHTML='';
  hero.style.display = pi===0 ? '' : 'none';
  const p=PAGES[pi];
  stream.dataset.top = p.header ? 'divider' : (pi===0 ? 'hero' : 'bare');
  if(p.header) stream.append(dividerEl(p.header));
  const shown=state.revealed[pi];
  for(let i=0;i<shown;i++){ const n=chunkEl(p.chunks[i]); n.classList.add('in'); stream.append(n); }
  stream.append(gateEl());
  if(state.done && pi===PAGES.length-1){ const e=endEl(); e.classList.add('in'); stream.append(e); }
  window.scrollTo({top: pi===0 ? 0 : 0, behavior:'auto'});
  buildToc(); progress();
}

/* ---------- contents drawer ---------- */
const toc=$('#toc');
function buildToc(){
  toc.innerHTML='';
  let n=0;
  PAGES.forEach((p,si)=>{
    if(!p.menu) return;
    /* a hidden continuation page counts as still being inside its listed page */
    let last=si; while(last+1<PAGES.length && !PAGES[last+1].menu) last++;
    const complete = state.revealed[last] >= PAGES[last].chunks.length && last < state.page;
    const here = state.page>=si && state.page<=last;
    if(si>0) n++;
    const a=el('a',null,'<span class="n">'+(si===0?'Start':'Part '+n)+(complete?'<span class="tick">&#9679;</span>':'')+'</span>'+p.name);
    a.href='#';
    if(here) a.setAttribute('aria-current','true');
    a.onclick=e=>{ e.preventDefault(); goPage(si); closeDrawer(); };
    toc.append(a);
  });
}
const drawer=$('#drawer'), menubtn=$('#menubtn');
function openDrawer(){ drawer.classList.add('on'); menubtn.setAttribute('aria-expanded','true'); }
function closeDrawer(){ drawer.classList.remove('on'); menubtn.setAttribute('aria-expanded','false'); }
menubtn.onclick=()=>drawer.classList.contains('on')?closeDrawer():openDrawer();
drawer.onclick=e=>{ if(e.target===drawer) closeDrawer(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });
$('#begin').onclick=()=>stream.scrollIntoView({behavior:'smooth',block:'start'});

/* ---------- progress ---------- */
const fill=$('#fill'), pct=$('#pct');
function progress(){
  let seen=0;
  PAGES.forEach((p,i)=>{ seen += (i<state.page) ? p.chunks.length : (i===state.page ? state.revealed[i] : 0); });
  const p=Math.min(100, Math.round(seen/TOTAL*100));
  fill.style.width=p+'%'; pct.textContent=p+'%';
}

goPage(0);
</script>
