<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key Responder Skills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
html{font-size:clamp(16px,0.42vw + 13.4px,24px)}
@media (max-width:760px){html{font-size:17px}}
:root{
  --trust:#FDDA64; --tranquil:#B8D8EB; --team:#235B4E; --taupe:#847770;
  --header:#222222; --body:#424759; --bg:#F0F2F5; --border:#D8DEEB; --white:#fff;
  --convo:#F1F8FC; --convo-line:#D3E7F3; --alert:#C0392B; --alert-bg:#FBEDEB;
  --sans:"Roboto","Helvetica Neue",Arial,sans-serif;
  --serif:"Lora",Georgia,"Times New Roman",serif;
  --col:46rem;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;scroll-behavior:smooth}
body{font-family:var(--serif);color:var(--body);background:var(--white);font-size:1.06rem;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.sans{font-family:var(--sans);color:var(--header);font-weight:500}
button{font:inherit}
:focus-visible{outline:2px solid var(--team);outline-offset:2px;border-radius:99px}
.skip{position:absolute;left:-9999px;background:var(--header);color:#fff;padding:10px 16px;z-index:200}
.skip:focus{left:0;top:0}

/* ---------- logo ---------- */
.lockup{display:flex;align-items:center;gap:.7rem}
.mark{background:var(--trust);color:var(--header);border-radius:50%;font-family:var(--sans);font-weight:700;display:grid;place-items:center;flex:0 0 auto;letter-spacing:-.02em}
.mark.lg{width:5rem;height:5rem;font-size:1.5rem}
.mark.md{width:2.5rem;height:2.5rem;font-size:.78rem}
.wordmark{font-family:var(--sans);font-weight:700;color:var(--header);line-height:1.12}
.wordmark.lg{font-size:1.5rem}
.wordmark.md{font-size:.8rem}

/* ---------- top bar ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.top .row{max-width:78rem;margin:0 auto;padding:.6rem 1.4rem;display:flex;align-items:center;gap:1rem}
.top .name{font-family:var(--sans);font-size:.82rem;color:var(--taupe);letter-spacing:.02em;line-height:1.3}
.top .name b{display:block;color:var(--header);font-weight:500;font-size:.95rem}
.top .spacer{flex:1}
.menu{font-family:var(--sans);font-size:.85rem;background:none;border:1.5px solid var(--border);border-radius:99px;padding:.42rem 1rem;cursor:pointer;color:var(--header);display:flex;align-items:center;gap:.5rem}
.menu:hover{border-color:var(--trust)}
.menu .bars{display:inline-flex;flex-direction:column;gap:3px}
.menu .bars i{width:14px;height:2px;background:var(--header);border-radius:2px}
.track{height:3px;background:var(--bg)}
.fill{height:100%;width:0;background:var(--trust);transition:width .12s linear}

.drawer{position:fixed;inset:0;z-index:99;background:rgba(34,34,34,.35);opacity:0;pointer-events:none;transition:opacity .25s}
.drawer.on{opacity:1;pointer-events:auto}
.drawer .panel2{position:absolute;right:0;top:0;bottom:0;width:min(23rem,88vw);background:var(--white);padding:5rem 1.6rem 2rem;overflow-y:auto;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.drawer.on .panel2{transform:none}
.drawer h4{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe);margin:0 0 .8rem}
.drawer a{display:block;font-family:var(--sans);font-size:.95rem;color:var(--body);text-decoration:none;padding:.6rem .8rem;border-radius:.7rem;line-height:1.35}
.drawer a:hover{background:var(--bg);color:var(--header)}
.drawer a .n{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--taupe)}

/* ---------- hero ---------- */
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:7rem 1.4rem 9rem;position:relative;overflow:hidden}
.hero .in{max-width:var(--col);margin:0 auto;width:100%;position:relative;z-index:1}
.hero .sweep{position:absolute;left:-10%;right:-10%;bottom:-6rem;height:18rem;background:var(--trust);border-radius:100% 100% 0 0 / 100% 100% 0 0}
.hero .circ{position:absolute;right:-3rem;bottom:0;width:15rem;height:15rem;border-radius:50%;background:var(--tranquil)}
.hero .lockup{margin-bottom:2.6rem}
.hero .kick{font-family:var(--sans);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--taupe);margin:0 0 .7rem}
.hero h1{font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.1;margin:0 0 .6rem;letter-spacing:-.5px}
.hero .sub{font-family:var(--sans);font-size:1.15rem;color:var(--header);margin:0 0 1.4rem}
.hero .meta{font-family:var(--sans);font-size:.85rem;color:var(--taupe);margin:0 0 2rem}
.scrollcue{display:inline-flex;align-items:center;gap:.7rem;background:var(--header);color:#fff;border:0;border-radius:99px;padding:.75rem 1.6rem;font-family:var(--serif);font-size:1rem;cursor:pointer}
.scrollcue:hover{transform:translateY(-1px)}

/* ---------- stream ---------- */
main{padding-bottom:6rem}
.col{max-width:var(--col);margin:0 auto;padding:0 1.4rem}
.blk{margin:0 auto;padding:2.2rem 0 0;scroll-margin-top:5rem}
/* A page opening with a divider clears the fixed bar on its own margin. A
   continuation page starts straight into a screen, so it needs the room. */
#stream[data-top="bare"]>.blk:first-child{padding-top:5.6rem}
.rev{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
.rev.in{opacity:1;transform:none}
p{margin:0 0 1rem}
h2{font-size:1.9rem;line-height:1.2;margin:0 0 .9rem;letter-spacing:-.3px}
h3{font-size:1.15rem;margin:1.6rem 0 .6rem}
.eyebrow{font-family:var(--sans);font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--taupe);margin:0 0 .5rem}
strong{font-weight:600;color:var(--header)}
ul.brand,ol.brand{margin:0 0 1rem;padding:0;list-style:none}
ul.brand li{position:relative;padding-left:1.5rem;margin-bottom:.55rem}
ul.brand li::before{content:"";position:absolute;left:.15rem;top:.72em;width:.5rem;height:.5rem;border-radius:50%;background:var(--trust)}
ol.brand{counter-reset:b}
ol.brand li{position:relative;padding-left:2.6rem;margin-bottom:.8rem;counter-increment:b}
ol.brand li::before{content:counter(b);position:absolute;left:0;top:0;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--trust);color:var(--header);font-family:var(--sans);font-weight:500;font-size:.85rem;display:grid;place-items:center}

.panel{background:var(--bg);border:1px solid var(--border);border-radius:1.2rem;padding:1.1rem 1.35rem;margin:0 0 1rem;position:relative;overflow:hidden}
.panel.blue{background:#EAF4FA;border-color:#CFE5F2}
.panel.blue::after{content:"";position:absolute;right:-2rem;top:-2.6rem;width:6rem;height:6rem;border-radius:50%;background:rgba(255,255,255,.55)}
.panel h4{margin:0 0 .35rem;font-size:1rem}
.panel p{margin:0;position:relative;z-index:1}
.note{font-style:italic;border-left:3px solid var(--taupe);padding:.15rem 0 .15rem 1rem;margin:0 0 1rem}
.note p{margin:0}
.keycall{border-left:.3rem solid var(--trust);background:var(--bg);border-radius:0 1rem 1rem 0;padding:1rem 1.3rem;margin:.4rem 0 1rem}
.keycall p{margin:0 0 .5rem;color:var(--header);font-family:var(--sans);font-size:1.02rem;line-height:1.5}
.keycall p:last-child{margin:0}

.cards{display:grid;gap:.7rem;margin:0 0 1rem}
.cards[data-cols="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.cards[data-cols="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.cards[data-cols="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
.cards[data-cols="5"]{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{background:var(--bg);border:1px solid var(--border);border-radius:1.1rem;padding:.85rem .95rem;display:flex;gap:.7rem;align-items:flex-start;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-2px);border-color:var(--trust)}
/* The lift on hover moves the bottom edge away from the pointer; this keeps
   the hover area where it was so a card at the edge does not flicker. */
.card{position:relative}.card::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px}
.card span{font-size:.97rem;line-height:1.5;min-width:0;overflow-wrap:anywhere}
.card .mk{flex:0 0 auto;font-family:var(--sans);font-size:.8rem;font-weight:500;color:var(--taupe);padding-top:.12rem}
.card .mk.dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--trust);margin-top:.6rem}
.cards.numbered .card{align-items:center}
.cards.tight .card{padding:.6rem .8rem}

.flips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin:.4rem 0 1rem}
.flips[data-cols="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.flip{perspective:1000px;min-height:15rem;display:grid}
.flip .inner{position:relative;width:100%;display:grid;transition:transform .55s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;cursor:pointer;background:none;border:0;padding:0;text-align:left;font:inherit}
.flip.on .inner{transform:rotateY(180deg)}
.face{grid-area:1/1;min-height:15rem;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:1.2rem;padding:1.2rem 1.15rem;display:flex;flex-direction:column;justify-content:space-between;gap:.7rem;overflow:hidden}
.face .n{font-family:var(--sans);font-weight:500;font-size:1.2rem;color:var(--header);opacity:.45;line-height:1}
.face .t{font-family:var(--sans);font-weight:500;font-size:1.05rem;color:var(--header);line-height:1.3;margin-top:auto}
.face .hint{font-family:var(--sans);font-size:.66rem;letter-spacing:.11em;text-transform:uppercase;color:var(--header);opacity:.55;line-height:1.3}
.face.f{background:var(--trust)}
.face.b{background:var(--bg);border:1px solid var(--border);transform:rotateY(180deg)}
.face.b p{font-size:.95rem;line-height:1.55;margin:0 0 auto}
.face.b .hint{opacity:.75}
.flip .inner:hover .face.f{filter:brightness(1.03)}

.tabs{margin:0 0 1rem}
.tablist{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem}
.tablist button{font-family:var(--sans);font-size:.85rem;border:1.5px solid var(--border);background:var(--white);color:var(--body);border-radius:99px;padding:.42rem 1rem;cursor:pointer}
.tablist button[aria-selected="true"]{background:var(--trust);border-color:var(--trust);color:var(--header);font-weight:500}
.tabpanel{background:var(--bg);border:1px solid var(--border);border-radius:1.2rem;padding:1.1rem 1.35rem}
.tabpanel h4{margin:0 0 .35rem;font-size:1rem}
.tabpanel p{margin:0}

.acc{border-top:1px solid var(--border);margin:0 0 1rem}
.acc-item{border-bottom:1px solid var(--border)}
.acc-item>button{width:100%;display:flex;gap:.8rem;align-items:center;background:none;border:0;cursor:pointer;padding:.85rem .2rem;text-align:left;font-family:var(--sans);font-size:1rem;color:var(--header);font-weight:500;line-height:1.35}
.acc-item>button .plus{margin-left:auto;flex:0 0 auto;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--trust);display:grid;place-items:center;position:relative;transition:transform .25s}
.acc-item>button .plus::before,.acc-item>button .plus::after{content:"";position:absolute;background:var(--header);border-radius:2px}
.acc-item>button .plus::before{width:.62rem;height:2px}
.acc-item>button .plus::after{width:2px;height:.62rem;transition:opacity .2s}
.acc-item.on>button .plus{transform:rotate(180deg)}
.acc-item.on>button .plus::after{opacity:0}
.acc-body{display:none;padding:0 2.4rem .9rem .2rem}
.acc-item.on .acc-body{display:block}
.acc-body p{margin:0;font-size:.98rem}
.acc-body li{font-size:.98rem}
.acc-body>:last-child{margin-bottom:0}

.reveal-list{display:flex;flex-direction:column;gap:.5rem;margin:0 0 .8rem}
.rv{display:flex;gap:.7rem;align-items:flex-start;background:var(--bg);border:1px solid var(--border);border-radius:1rem;padding:.7rem .95rem}
.rv .d{width:.5rem;height:.5rem;border-radius:50%;background:var(--trust);flex:0 0 auto;margin-top:.6rem}
.rv span{font-size:.97rem;line-height:1.5}
.btn{font-family:var(--serif);font-size:1rem;border-radius:99px;padding:.6rem 1.5rem;border:1.5px solid transparent;cursor:pointer;background:var(--header);color:#fff}
.btn:hover{transform:translateY(-1px)}
.btn{position:relative}.btn::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px}
.btn.ghost{background:var(--white);color:var(--header);border-color:var(--border)}
.btn.ghost:hover{border-color:var(--header);background:var(--white)}
.fb.no .btn.ghost{border-color:#E4B7B1}
.fb.no .btn.ghost:hover{border-color:var(--alert);color:var(--alert)}
.fb.no :focus-visible{outline-color:var(--alert)}
.btn.yellow{background:var(--trust);color:var(--header)}
.btn.small{font-size:.88rem;padding:.5rem 1.15rem}

/* ---------- section divider ---------- */
.divider{margin:4.5rem 0 1rem;padding:3.2rem 1.4rem;border-top:1px solid var(--border);border-bottom:.5rem solid var(--trust);background:var(--white);scroll-margin-top:4.5rem}
.divider[data-tone="tranquil"]{border-bottom-color:var(--tranquil)}
.divider .in{max-width:var(--col);margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 9.5rem;gap:2rem;align-items:center}
.divider .num{font-family:var(--sans);font-weight:500;font-size:3.8rem;line-height:1;color:var(--trust);margin:0 0 .1rem}
.divider[data-tone="tranquil"] .num{color:var(--tranquil)}
.divider .rule{width:3.2rem;height:.32rem;border-radius:99px;background:var(--trust);margin:0 0 .9rem}
.divider[data-tone="tranquil"] .rule{background:var(--tranquil)}
.divider .kick{font-family:var(--sans);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--taupe);margin:0 0 .4rem}
.divider h2{font-size:2.3rem;margin:0 0 .6rem}
.divider .line{margin:0;max-width:40ch}
.divider .art{width:100%;height:auto}

/* ---------- table ---------- */
.tbl{margin:1rem 0;border:1px solid var(--border);border-radius:1.1rem;overflow:hidden}
.tbl table{width:100%;border-collapse:collapse}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:.75rem .9rem;font-size:.96rem;line-height:1.5;border-bottom:1px solid var(--border)}
.tbl tbody:empty{display:none}
.tbl thead th{font-family:var(--sans);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--taupe);font-weight:500;background:var(--bg)}
.tbl tbody th{font-family:var(--sans);font-weight:500;color:var(--header);font-size:1rem}
.tbl tbody tr:last-child th,.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:nth-child(even) th,.tbl tbody tr:nth-child(even) td{background:#FBFBFD}

/* ---------- knowledge check ---------- */
.check{background:#F7F8FB;border:1px solid var(--border);border-radius:1.4rem;padding:1.4rem 1.5rem;margin:1rem 0}
.check .hint{font-family:var(--serif);font-style:italic;color:var(--taupe);font-size:.98rem;margin:-.4rem 0 .9rem}
.check .prompt{font-family:var(--sans);font-size:1.1rem;color:var(--header);font-weight:500;margin:0 0 .9rem;line-height:1.4}
.check .prompt.scenario{font-family:var(--serif);font-weight:400;color:var(--body);font-size:1.02rem;line-height:1.6;margin:0 0 .8rem}
.check .prompt.ask{margin:0 0 .9rem}
.opts{display:flex;flex-direction:column;gap:.55rem}
.opt{display:flex;gap:.8rem;align-items:flex-start;text-align:left;width:100%;background:var(--white);border:1.5px solid var(--border);border-radius:1rem;padding:.75rem .9rem;cursor:pointer;color:var(--body);font-family:var(--serif);font-size:1rem;line-height:1.5;transition:border-color .18s,background .18s}
.opt:hover:not(:disabled){border-color:var(--trust)}
.opt:disabled{cursor:default}
.opt .key{flex:0 0 auto;width:1.6rem;height:1.6rem;border-radius:50%;background:#E6E9EF;color:var(--header);font-family:var(--sans);font-size:.82rem;font-weight:500;display:grid;place-items:center;margin-top:.05rem}
.opt[data-picked="1"]{border-color:var(--header)}
.opt[data-picked="1"] .key{background:var(--header);color:#fff}
.opt[data-outcome="correct"]{border-color:var(--team);border-width:2px;background:#EAF3EF}
.opt[data-outcome="correct"] .key{background:var(--team);color:#fff}
.opt[data-outcome="wrong"]{border-color:var(--alert);border-width:2px;background:var(--alert-bg)}
.opt[data-outcome="wrong"] .key{background:var(--alert);color:#fff}
.opt[data-outcome="info"]{border-color:var(--tranquil)}
.opt[data-outcome="info"] .key{background:var(--tranquil)}
.opt[data-outcome="dim"]{opacity:.5}
.fb{border-radius:1rem;padding:.85rem 1.1rem;margin-top:.8rem;font-size:1rem}
.fb p{margin:0}
.fb p+p{margin-top:.7rem}
.fb .thread{margin:.7rem 0 0}
.fb .thread+p{margin-top:.7rem}
.fb.yes{background:#E4EFEA;border-left:.3rem solid var(--team);color:#1D4A40}
.fb.no{background:var(--alert-bg);border-left:.3rem solid var(--alert)}
.fb.info{background:#EAF4FA;border-left:.3rem solid #7FB4D4}
.fb .cards{margin:.7rem 0 0}
.fb .card{background:var(--white);border-color:#CFE5F2} .fb.info .head{color:#2C6C90}

/* ---------- transcripts ---------- */
.vig{border:1px solid var(--border);border-radius:1.4rem;padding:1.3rem 1.4rem;margin:1rem 0 0}
.vig-head{display:flex;align-items:center;gap:.8rem;margin:0 0 1rem;flex-wrap:wrap}
.avatar{width:2.6rem;height:2.6rem;border-radius:50%;background:var(--tranquil);display:grid;place-items:center;font-family:var(--sans);font-weight:500;color:var(--header)}
.vig-head .nm{font-family:var(--sans);font-size:1.1rem;color:var(--header);font-weight:500;display:block;line-height:1.2}
.vig-head .sub{font-family:var(--sans);font-size:.78rem;color:var(--taupe)}
.chip{font-family:var(--sans);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:500;padding:.35rem .8rem;border-radius:99px;background:var(--trust);color:var(--header)}
.chip.blue{background:var(--tranquil)}
.thread{background:var(--convo);border:1px solid var(--convo-line);border-radius:1.1rem;padding:1rem 1.15rem;margin:0 0 1rem}
.thread .ch{font-family:var(--sans);font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:var(--taupe);font-weight:500;margin:0 0 .7rem}
.line{margin:0 0 .7rem}
.line:last-child{margin-bottom:0}
.line .spk{font-family:var(--sans);font-size:.78rem;font-weight:500;color:var(--header);display:block;margin-bottom:.15rem}
.line .meta{font-style:italic;color:var(--taupe)}
.bubble{max-width:88%;padding:.65rem .9rem;border-radius:1.1rem;margin:0 0 .45rem;font-size:1rem;line-height:1.55;position:relative;z-index:1}
.bubble.them{background:var(--white);border:1px solid var(--convo-line);border-bottom-left-radius:.35rem}
.bubble.us{background:var(--tranquil);border-bottom-right-radius:.35rem;margin-left:auto;color:var(--header)}
.bubble .spk{font-family:var(--sans);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--taupe);display:block;margin-bottom:.2rem}
.sysline{font-style:italic;color:var(--taupe);font-size:.95rem;margin:.2rem 0 .7rem;text-align:center}
/* An annotation hangs off the message it belongs to: same yellow as the
   highlight, tucked under the bubble, so it reads as part of that message
   rather than as the next one in the thread. */
.ann{display:none;max-width:88%;margin:-.55rem 0 .9rem auto;padding:.9rem .95rem .6rem;background:#FFF3C4;border:1px solid var(--trust);border-top:0;border-radius:0 0 .9rem .9rem;font-size:.95rem;line-height:1.5;color:var(--header);position:relative;z-index:0}
.ann .spk{color:#6B5A1E}
.ann.on{display:block}
.col p.instr{margin:-.3rem 0 .9rem}
.col p.indent{margin-left:1.6rem;padding-left:1rem;border-left:2px solid var(--border)}
mark{background:var(--trust);color:var(--header);padding:.05em .25em;border-radius:.3em;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone;border-bottom:2px solid rgba(34,34,34,.35);transition:background .15s}
mark:hover{filter:brightness(.95)}
mark.on{background:var(--header);color:var(--white);border-bottom-color:var(--header)}
mark:focus-visible{outline:2px solid var(--header);outline-offset:2px}
.ann .spk{font-family:var(--sans);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--taupe);display:block;margin-bottom:.2rem}
.col p a,.col li a,.col .note a{color:var(--header);text-decoration:underline;text-underline-offset:.15em}
.typing{display:inline-flex;gap:5px;padding:.7rem .9rem;background:var(--white);border:1px solid var(--convo-line);border-radius:1.1rem}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--taupe);opacity:.5;animation:blink 1.3s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:.9;transform:translateY(-3px)}}
.step{font-family:var(--sans);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--taupe);font-weight:500;display:flex;align-items:center;gap:.6rem;margin:1.4rem 0 .6rem}
.step .n{width:1.5rem;height:1.5rem;border-radius:50%;background:var(--trust);color:var(--header);display:grid;place-items:center;font-size:.75rem;letter-spacing:0}
.locked{opacity:.45;pointer-events:none}
.gate{max-width:var(--col);margin:2.6rem auto 1rem;padding:1.4rem 1.4rem 0;border-top:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:.7rem;text-align:center}
.gate .btn{max-width:100%}
.gate .back{background:none;border:0;color:var(--taupe);font-family:var(--sans);font-size:.85rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.gate .back:hover{color:var(--header)}
.drawer a[aria-current="true"]{background:var(--bg);color:var(--header);font-weight:500}
.drawer a .tick{float:right;color:var(--trust)}

/* ---------- video / reflection / refs / end ---------- */
.video .frame{position:relative;aspect-ratio:16/9;border-radius:1.3rem;background:var(--bg);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;margin:0 0 1rem}
.video .play{width:3.6rem;height:3.6rem;border-radius:50%;background:var(--trust);position:relative}
.video .play::after{content:"";position:absolute;left:53%;top:50%;transform:translate(-50%,-50%);border-left:1.05rem solid var(--header);border-top:.65rem solid transparent;border-bottom:.65rem solid transparent}
.video .lbl{font-family:var(--sans);font-size:.85rem;color:var(--taupe)}
.reflect label{display:block;font-family:var(--sans);font-size:1rem;color:var(--header);font-weight:500;margin:0 0 .45rem;line-height:1.4}
.field{margin-bottom:1rem}
textarea{width:100%;min-height:5rem;border:1.5px solid var(--border);border-radius:1rem;padding:.8rem .9rem;font-family:var(--serif);font-size:1rem;color:var(--body);line-height:1.55;resize:vertical;background:var(--white)}
textarea:focus{border-color:var(--trust);outline:none;box-shadow:0 0 0 3px rgba(253,218,100,.4)}
.refs p{font-size:.9rem;line-height:1.5;margin:0 0 .6rem;padding-left:1.4rem;text-indent:-1.4rem}
.end{margin-top:4rem;padding:4rem 1.4rem 5rem;position:relative;overflow:hidden;border-top:1px solid var(--border)}
.end .in{max-width:var(--col);margin:0 auto;position:relative;z-index:1}
.end .sweep{position:absolute;left:-10%;right:-10%;bottom:-7rem;height:14rem;background:var(--trust);border-radius:100% 100% 0 0 / 100% 100% 0 0}
.end h2{font-size:2.1rem}
.foot{padding:1.2rem 1.4rem;border-top:1px solid var(--border);display:flex;align-items:center;gap:.8rem;justify-content:center;font-family:var(--sans);font-size:.78rem;color:var(--taupe)}

@media (max-width:760px){
  .cards[data-cols="2"],.cards[data-cols="3"],.cards[data-cols="4"],.cards[data-cols="5"]{grid-template-columns:1fr}
  .tbl thead{display:none}
  .tbl table,.tbl tbody,.tbl tr,.tbl th,.tbl td{display:block;width:100%}
  .tbl tr{border-bottom:1px solid var(--border);padding:.3rem 0}
  .tbl tr:last-child{border-bottom:0}
  .tbl tbody th{padding-bottom:.2rem;border-bottom:0}
  .tbl tbody td{border-bottom:0;padding-top:.15rem}
  .tbl tbody td::before{content:attr(data-lbl);display:block;font-family:var(--sans);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--taupe);margin-bottom:.15rem}
  .tbl tbody tr:nth-child(even) th,.tbl tbody tr:nth-child(even) td{background:transparent}
  .flips{grid-template-columns:1fr}
  .flip,.face{min-height:9rem}
  .face{padding:1rem}
  .divider .in{grid-template-columns:1fr}
  .divider .art{max-width:11rem}
  .divider h2{font-size:1.8rem}
  .top .name{display:none}
  .top .row{padding:.5rem 1rem;gap:.7rem}
  .wordmark.md{font-size:.72rem}
  .menu{padding:.38rem .8rem;font-size:.8rem}
  .hero{padding:6rem 1.2rem 8rem}
  .blk{padding-top:1.8rem}
  #stream[data-top="bare"]>.blk:first-child{padding-top:5rem}
  .gate .btn{white-space:normal}
  .gate{margin-top:2rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rev{opacity:1;transform:none}}

.audio{margin:0 0 1rem}
.audio .bar{display:flex;align-items:center;gap:.9rem;background:var(--convo);border:1px solid var(--convo-line);border-radius:1.1rem;padding:.75rem 1rem}
.audio .play{flex:0 0 auto;width:2.5rem;height:2.5rem;border-radius:50%;background:var(--trust);position:relative}
.audio .play::after{content:"";position:absolute;left:54%;top:50%;transform:translate(-50%,-50%);border-left:.72rem solid var(--header);border-top:.45rem solid transparent;border-bottom:.45rem solid transparent}
.audio .meta{min-width:0}
.audio .ttl{display:block;font-family:var(--sans);font-size:.9rem;color:var(--header);line-height:1.3}
.audio .sub{display:block;font-family:var(--sans);font-size:.75rem;color:var(--taupe)}
.audio .wave{flex:1;height:1.6rem;display:flex;align-items:center;gap:2px;opacity:.45;min-width:3rem}
.audio .wave span{flex:1;background:var(--taupe);border-radius:99px}
.audio.live .wave{opacity:1;cursor:pointer}.audio.live .wave span{background:var(--border);transition:background .1s}.audio.live .wave span.on{background:var(--header)}
.audio button.play{border:0;padding:0;cursor:pointer}
.audio .play.pause::after{border:0;width:.7rem;height:.8rem;border-left:.22rem solid var(--header);border-right:.22rem solid var(--header);left:50%}
.audio button.play:focus-visible{outline:2px solid var(--header);outline-offset:2px}
.transbtn{margin:.6rem 0 0;font-family:var(--sans);font-size:.85rem;background:none;border:1.5px solid var(--border);border-radius:99px;padding:.38rem 1rem;cursor:pointer;color:var(--header)}
.transbtn:hover{border-color:var(--trust)}
.audio .thread{margin:.7rem 0 0}
@media (max-width:760px){ .audio .wave{display:none} }

  {p:`In Module 2, you learned about the supportive, collaborative, empathic, and respectful approach you should bring to every interaction. This module builds on that foundation by looking more closely at the experiences and assumptions that can shape what happens between you and the person reaching out.`, lede:true},
  {p:`Many callers and texters you will encounter have experienced:`},
  {cards:{cols:4, tight:true, items:[
    {t:`Trauma`},{t:`Racism`},{t:`Discrimination`},{t:`Harmful encounters with services`}
  ]}},
  {p:`These experiences can affect what feels safe, how readily a person trusts a given service, and what they feel comfortable sharing. At the same time, your own experiences and assumptions can also influence how you interpret what you hear on the lines.`},
  {p:`In this module, you will explore how trauma-informed practice, cultural humility, and awareness of bias can help you respond with greater safety, curiosity, and respect for the person's experience. As you continue through this course, you will apply this lens to the specific listening techniques and communication skills you will develop in later modules.`},
  {note:`Estimated completion time: 45-60 minutes`}
]},

{sec:0, type:'prose', title:'Learning objectives', blocks:[
  {p:`By the end of this module, you will be able to:`},
  {cards:{cols:1, num:true, items:[
    {t:`Match trauma-informed principles to conversational behaviours you can use during voice and text interactions`},
    {t:`Recognize responses that risk re-traumatizing a caller or texter and select alternatives that support safety, transparency, collaboration, and empowerment`},
    {t:`Explain how cultural humility and ongoing self-reflection support relational safety`},
    {t:`Identify how implicit bias and intersecting forms of discrimination can influence your interpretation of an interaction`},
    {t:`Select responses that recognize racism, discrimination, and other social realities as legitimate sources of distress`},
    {t:`Use warm, collaborative, permission-based language when offering culturally specific services and resources`}
  ]}}
]},

{sec:0, type:'prose', title:'Module topics', blocks:[
  {instr:`Turn each card to see what the topic covers.`},
  {flip:[
    {front:`Trauma-informed practice`, back:`How the four Rs and six principles show up in conversation.`},
    {front:`Bias in crisis response`, back:`How implicit bias can shape what you hear and how you respond.`},
    {front:`Cultural humility and intersectionality`, back:`How ongoing reflection supports relational safety.`},
    {front:`Offering culturally specific services`, back:`How to offer a resource without losing the connection.`}
  ]}
]},

/* ---------------- TOPIC 1 ---------------- */
{sec:1, type:'section', num:'01', kicker:'Topic 1', art:'a',
 title:`Trauma-informed practice`, line:`How the four Rs and six principles show up in conversation.`},

{sec:1, type:'prose', blocks:[
  {p:`In Module 2, Dominique needed clear information about confidentiality before she felt comfortable explaining why she had called. This is because her earlier experiences with services shaped what she needed from the responder in that moment.`, lede:true},
  {p:`Trauma-informed practice begins with this kind of awareness. Many people who contact 9-8-8 have experienced trauma, and those experiences may affect:`},
  {cards:{cols:3, tight:true, items:[
    {t:`How they communicate`},
    {t:`What feels safe`},
    {t:`How readily they trust a service or responder`}
  ]}},
  {panel:{cls:'blue', p:`9-8-8 is designed to be a <strong>trauma-informed service</strong>. As a responder, your job is therefore to apply this approach in every interaction, regardless of whether a person has disclosed a history of trauma.`}}
]},

{sec:1, type:'prose', title:'What trauma can include', blocks:[
  {p:`Trauma can result from an experience, or a series of experiences, that overwhelms a person's ability to cope with certain situations. It can affect:`, lede:true},
  {cards:{cols:3, tight:true, items:[
    {t:`How they feel`},{t:`How they relate to others`},{t:`How they respond to stress`}
  ]}},
  {p:`Traumatic experiences can include:`},
  {ul:[
    `Abuse, violence, neglect, serious illness or injury, or loss`,
    `Racism, discrimination, and harassment from individuals or institutions`,
    `Harmful encounters with services, including being dismissed, disbelieved, or having emergency services sent without consent`,
    `Harm experienced across families or communities, including the ongoing effects of colonization`
  ]},
  {p:`These experiences can all shape what happens in a 9-8-8 interaction. For example:`},
  {ul:[
    `Someone who has been previously dismissed may be cautious about sharing.`,
    `Someone who has lost control over what happened during a previous crisis may want to know what a responder will do with the information they provide.`
  ]},
  {p:`Trauma-informed practice means taking these possibilities seriously and responding in ways that support trust, choice, and control.`},
  {key:[`Together, these choices help create what we refer to as <strong>relational safety</strong>.`]}
]},

{sec:1, type:'prose', title:'Relational safety', blocks:[
  {p:`The 9-8-8 <em>Safety and Wellbeing Framework</em> describes relational safety as the experience of trust and security in a relationship. This includes both psychological and cultural safety, and it is a crucial element in establishing a connection with callers and texters and navigating interactions effectively.`, lede:true},
  {p:`For someone who reaches out to 9-8-8, relational safety develops through the way the responder handles the interaction.`},
  {p:`To create relational safety as a responder, you need to ensure you:`},
  {cards:{cols:2, items:[
    {t:`Remain predictable and transparent`},
    {t:`Respect the person's choices`},
    {t:`Work collaboratively at all stages`},
    {t:`Respond to experiences and identity with care`}
  ]}},
  {p:`In the next section, you will explore two frameworks of trauma-informed practice that can help you make choices that establish relational safety.`}
]},

{sec:1, type:'prose', title:'The four Rs of trauma-informed care', blocks:[
  {p:`The first framework is called the <em>Four Rs</em>, and it was developed by the Substance Abuse and Mental Health Services Administration (SAMHSA).`, lede:true},
  {p:`This framework describes the overall approach to trauma-informed practice using four actions that you can take as a responder.`},
  {instr:`Turn each card to read it.`},
  {flip:[
    {front:`Realize`, back:`<strong>Realize</strong> that trauma is common and can shape how people cope, communicate, and build trust.`},
    {front:`Recognize`, back:`<strong>Recognize</strong> when trauma may be influencing an interaction. A person may be cautious about sharing, ask what will happen with their information, or react strongly when the conversation changes direction.`},
    {front:`Respond`, back:`<strong>Respond</strong> by applying this understanding to the way you pace the interaction, ask questions, provide information, and offer support.`},
    {front:`Resist re-traumatization`, back:`<strong>Resist re-traumatization</strong> by responding in ways that preserve the person's sense of control, dignity, and safety. This means avoiding responses that may repeat experiences where a person has felt they have lost control, encountered disbelief, or been pressured by a service provider.`}
  ]}
]},

{sec:1, type:'prose', title:'The six principles of trauma-informed care', blocks:[
  {p:`While the <em>Four Rs</em> help you stay alert to how trauma may be shaping an interaction, SAMHSA also developed <em>six principles</em> to provide more specific guidance for how to put these ideas into action.`, lede:true},
  {p:`In a 9-8-8 interaction, each of the following principles should be reflected in the choices you make throughout the conversation:`},
  {acc:[
    {q:`Safety`,
     a:`Use a calm, steady, and predictable approach. Keep your pace manageable and let the person know what is happening or what you would like to do next.`},
    {q:`Trustworthiness and transparency`,
     a:`Be clear about what the service is, the limits of confidentiality, and what the person can expect from you. Follow through on what you say.`},
    {q:`Peer support`,
     a:`Recognize the value of support from people with shared experiences, and explore the relationships, groups, and communities that may already be meaningful to the person.`},
    {q:`Collaboration and mutuality`,
     a:`Work alongside the person, ask permission before changing direction, and draw on their knowledge of their own life and circumstances.`},
    {q:`Empowerment, voice, and choice`,
     a:`Offer meaningful choice and support the person's control over what they share, when they share it, and what happens next.`},
    {q:`Cultural, historical, and gender considerations`,
     a:`Recognize that culture, history, identity, and experiences of discrimination can shape what feels safe. Respond to how the person describes their own experience and identity.`}
  ]}
]},

/* ---------------- ACTIVITY: PRINCIPLE TO BEHAVIOUR ---------------- */
/* Briefing on its own page; the six excerpts run continuously on the next. */
{sec:2, type:'section', kicker:'Activity', art:'d', tone:'tranquil',
 title:`Principle to behaviour`, line:`Read six short excerpts and decide whether the responder is being trauma-informed, and which principle applies.`},

{sec:2, type:'prose', title:'How this activity works', blocks:[
  {p:`The six trauma-informed principles become meaningful through the choices you make during an interaction.`, lede:true},
  {p:`In this activity, you will look at key moments from six different 9-8-8 interactions. For each excerpt, you will:`},
  {ol:[
    `Decide whether the responder demonstrates a trauma-informed principle`,
    `Identify which of the six principles is most clearly involved, or which principle should have been involved`
  ]},
  {p:`Some of the callers and texters will be familiar from earlier modules.`},
  {note:`Your answers are not scored. The purpose of this activity is to practise identifying whether or not responses are trauma-informed, and identify what the principles look like in conversation.`}
]},

/* --- Excerpt 1: Sam --- */
{sec:3, type:'mcq', title:'Excerpt 1: Sam',
 intro:[
  {audio:{label:`Sam's call`, ch:'Voice call', lines:[
    {spk:'Caller', t:`Before I say anything else, what happens to this? Like, is there a file somewhere?`},
    {spk:'Responder', t:`There is. We keep records of interactions, and calls can be recorded for quality and training. What you tell me stays inside the 9-8-8 network, unless the law requires it or I ever needed to get emergency help to keep you or someone else safe. You don't have to give your name.`}
  ]}}
 ],
 prompt:`Does the responder's reply demonstrate a trauma-informed principle?`,
 hint:`Select the best answer.`,
 options:[
  {k:'A', t:`Yes`, correct:true,
   fb:`The responder answers Sam's question clearly and accurately, including the limits of confidentiality.`},
  {k:'B', t:`No`, correct:false,
   fb:`Look at what Sam asked and how the responder answered. Sam receives the information needed to understand what will happen with what he shares.`}
 ]},

{sec:3, type:'mcq',
 prompt:`Which principle is the responder demonstrating most clearly?`,
 hint:`Select the best answer.`,
 oneFb:`Trustworthiness and transparency means giving clear, accurate information about the service and what the person can expect. Sam now has enough information to decide what he feels comfortable sharing. You saw the same principle when Dominique asked about confidentiality in Module 2.`,
 options:[
  {k:'A', t:`Safety`, correct:false},
  {k:'B', t:`Trustworthiness and transparency`, correct:true},
  {k:'C', t:`Peer support`, correct:false},
  {k:'D', t:`Collaboration and mutuality`, correct:false},
  {k:'E', t:`Empowerment, voice, and choice`, correct:false},
  {k:'F', t:`Cultural, historical, and gender considerations`, correct:false}
 ]},

/* --- Excerpt 2: Jae --- */
{sec:3, type:'mcq', title:'Excerpt 2: Jae',
 intro:[
  {thread:{ch:'Text', lines:[
    {who:'them', spk:'Texter', t:`i haven't really told anyone all of this. i don't know if i want to get into the rest`},
    {who:'us', spk:'Responder', t:`I understand, but I really need the whole picture to help you properly. Can you tell me more about what happened?`}
  ]}}
 ],
 prompt:`Does the responder's reply demonstrate a trauma-informed principle?`,
 hint:`Select the best answer.`,
 options:[
  {k:'A', t:`Yes`, correct:false,
   fb:`Jae has just expressed uncertainty about sharing more. Consider who should decide how much of the story is shared.`},
  {k:'B', t:`No`, correct:true,
   fb:`Jae is communicating their limit. The responder continues asking for details, which reduces Jae's control over what they share.`}
 ]},

{sec:3, type:'mcq',
 prompt:`Which principle should the responder have demonstrated in this interaction?`,
 hint:`Select the best answer.`,
 oneFb:`Empowerment, voice, and choice includes respecting the person's control over what they share and when. A trauma-informed response could be: "That's okay. What you share from here is up to you. We can stay with what you've told me so far."`,
 options:[
  {k:'A', t:`Safety`, correct:false},
  {k:'B', t:`Trustworthiness and transparency`, correct:false},
  {k:'C', t:`Peer support`, correct:false},
  {k:'D', t:`Collaboration and mutuality`, correct:false},
  {k:'E', t:`Empowerment, voice, and choice`, correct:true},
  {k:'F', t:`Cultural, historical, and gender considerations`, correct:false}
 ]},

/* --- Excerpt 3: Dominique --- */
{sec:3, type:'mcq', title:'Excerpt 3: Dominique',
 intro:[
  {audio:{label:`Dominique's call`, ch:'Voice call', lines:[
    {spk:'Caller', t:`I keep going over what the case worker said to me, again and again, and I...`},
    {spk:'Responder', t:`Okay, let's move on to who you have around you that can support you. Do you have family close by? Friends?`}
  ]}}
 ],
 prompt:`Does the responder's reply demonstrate a trauma-informed principle?`,
 hint:`Select the best answer.`,
 options:[
  {k:'A', t:`Yes`, correct:false,
   fb:`Pay attention to when the responder changes direction and whether Dominique is included in that decision.`},
  {k:'B', t:`No`, correct:true,
   fb:`The responder changes direction while Dominique is still speaking. Asking before moving to another topic would keep the conversation more collaborative.`}
 ]},

{sec:3, type:'mcq',
 prompt:`Which principle should the responder have demonstrated in this interaction?`,
 hint:`Select the best answer.`,
 oneFb:`Collaboration and mutuality means working with the person on the direction of the conversation. Dominique has already described experiences of being processed by systems and having decisions made around her. A collaborative response gives her a say in what happens next: "Would it be okay if we looked at who you have around you for support, or would you like to stay with this for now?"`,
 options:[
  {k:'A', t:`Safety`, correct:false},
  {k:'B', t:`Trustworthiness and transparency`, correct:false},
  {k:'C', t:`Peer support`, correct:false},
  {k:'D', t:`Collaboration and mutuality`, correct:true},
  {k:'E', t:`Empowerment, voice, and choice`, correct:false},
  {k:'F', t:`Cultural, historical, and gender considerations`, correct:false}
 ]},

/* --- Excerpt 4: Marc --- */
{sec:3, type:'mcq', title:'Excerpt 4: Marc',
 intro:[
  {audio:{label:`Marc's call`, ch:'Voice call', lines:[
    {spk:'Caller', meta:`(speaking quickly, breath short)`, t:`I don't even know where to start. It's all, everything's just...`},
    {spk:'Responder', meta:`(slowly, evenly)`, t:`Take whatever time you need. There's no rush here. When you're ready, start wherever feels easiest, and we'll go from there.`}

   fb:`Look again at the responder's pace and what they tell Marc about what happens next. Nothing here pushes him or surprises him.`}
 ]},

{sec:3, type:'mcq',

 oneFb:`A calm, steady, predictable manner is how safety is expressed on a crisis line. Marc is monitoring closely for how the responder reacts, and an even pace tells him there is no alarm on the other end of the line.`,
 options:[
  {k:'A', t:`Safety`, correct:true},
  {k:'B', t:`Trustworthiness and transparency`, correct:false},
  {k:'C', t:`Peer support`, correct:false},
  {k:'D', t:`Collaboration and mutuality`, correct:false},
  {k:'E', t:`Empowerment, voice, and choice`, correct:false},
  {k:'F', t:`Cultural, historical, and gender considerations`, correct:false}
 ]},

/* --- Excerpt 5: Jae --- */
{sec:3, type:'mcq', title:'Excerpt 5: Jae',
 intro:[
  {thread:{ch:'Text', lines:[
    {who:'them', spk:'Texter', t:`in my family we don't really talk about stuff like this. it's not how we do things in my culture`},
    {who:'us', spk:'Responder', t:`You really should tell your parents what's going on. Family usually wants to know, and it's better than carrying it alone.`}
  ]}}
 ],
 prompt:`Does the responder's reply demonstrate a trauma-informed principle?`,

 options:[
  {k:'A', t:`Yes`, correct:false,
   fb:`Consider what Jae has just told the responder about their family and whether the reply reflects that information.`},
  {k:'B', t:`No`, correct:true,
   fb:`The responder applies a general assumption about family support instead of exploring Jae's description of their own family.`}
 ]},

{sec:3, type:'mcq',
 prompt:`Which principle should the responder have demonstrated in this interaction?`,
 hint:`Select the best answer.`,
 oneFb:`Cultural, historical, and gender considerations include responding to the person's own description of their relationships, culture, identity, and circumstances. A response grounded in Jae's experience could be: "It sounds like talking about this openly isn't how things work in your family. What has it been like carrying it on your own?"`,
 options:[
  {k:'A', t:`Safety`, correct:false},
  {k:'B', t:`Trustworthiness and transparency`, correct:false},
  {k:'C', t:`Peer support`, correct:false},
  {k:'D', t:`Collaboration and mutuality`, correct:false},
  {k:'E', t:`Empowerment, voice, and choice`, correct:false},
  {k:'F', t:`Cultural, historical, and gender considerations`, correct:true}
 ]},

/* ------------- TOPIC 1, RESUMED AFTER THE ACTIVITY ------------- */
{sec:3, type:'prose', title:'Activity debrief', blocks:[
  {p:`Across these six excerpts, you can see that trauma-informed practice comes down to small decisions you make as a responder in conversation:`, lede:true},
  {cards:{cols:3, tight:true, items:[
    {t:`Answering questions clearly`},
    {t:`Respecting a limit`},
    {t:`Asking before changing direction`},
    {t:`Slowing the pace`},
    {t:`Listening to how the person describes their own experience`},
    {t:`Noticing meaningful sources of connection`}
  ]}},
  {p:`Together, these choices also support the fourth R: <strong>resisting re-traumatization</strong>.`}
]},

{sec:4, type:'prose', title:'Resisting re-traumatization', blocks:[
  {p:`Re-traumatization can occur when an interaction recreates aspects of a previous harmful experience, such as a loss of control, pressure, disbelief, or unpredictability.`, lede:true},
  {p:`In a 9-8-8 interaction, this risk can increase when a responder:`},
  {ul:[
    `Presses for details the person has chosen not to share`,
    `Makes guarantees that cannot be kept`,
    `Takes control of the direction of the conversation without asking`,
    `Interprets caution as resistance instead of information about what the person needs`,
    `Responds to a disclosure with alarm or an abrupt shift into procedure`
  ]},
  {panel:{cls:'blue', p:`While these responses may be well-intentioned, their impact can resemble experiences the person has already had of being pushed, dismissed, or denied autonomy and control.`}}
]},

/* ---------------- ACTIVITY: FIND THE HARM ---------------- */
{sec:5, type:'section', kicker:'Activity', art:'b', tone:'tranquil',
 title:`Find the harm`, line:`Read a text exchange, note where the responder's choices could cause harm, and compare your thoughts with the annotations.`},

{sec:5, type:'prose', title:'How this activity works', blocks:[
  {p:`Let's now look more closely at how the pattern of re-traumatization can unfold across an interaction and learn to identify opportunities to respond differently.`, lede:true},
  {p:`In this activity, a texter has been talking with a responder for a while. During the interaction, they share that they stopped using 9-8-8 after emergency services were sent during a previous crisis. Despite this, they have now chosen to reach out again.`},
  {p:`For this activity, you will:`},
  {ol:[
    `Read the following exchange and take note of the moments where the responder's choices could recreate experiences of pressure, mistrust, or loss of control.`,
    `Answer the reflection questions and review the annotations after you're finished.`
  ]},
  {note:`Your answers are not scored. The texter's safety was explored earlier in the interaction. Suicide risk assessment and emergency intervention procedures are taught in the SASP course. Here, focus on how the responder handles what the texter shares about their earlier experience.`}
]},

/* The reflection questions come first, then the exchange with its
   annotations behind the highlighted words, then the closing feedback. */
{sec:6, type:'write', title:'The exchange', numbered:true, plainFeedback:true,
 intro:[
  {thread:{ch:'Text', lines:[
    {who:'them', spk:'Texter', t:`i should probably say. i stopped texting here for a while. last year someone sent the police to my place while i was texting with them`},
    {who:'us', spk:'Responder 1', t:`I'm so sorry that happened to you. I can promise you that's not going to happen tonight.`},
    {who:'them', spk:'Texter', t:`you can't really promise that though`},
    {who:'us', spk:'Responder 2', t:`What happened that time? Had you said something that made them think you were in danger?`},
    {who:'them', spk:'Texter', t:`i don't really want to go back through all of it`},
    {who:'us', spk:'Responder 3', t:`That's okay, but it would help me understand your situation. Did they take you to the hospital? How long were you there?`},
    {who:'them', spk:'Texter', meta:`(a long pause)`, t:`it doesn't matter`},
    {who:'us', spk:'Responder 4', t:`Okay. Let's put that aside and talk about tonight. I want to go through some questions with you about how safe you are right now.`},
    {who:'them', spk:'Texter', t:`ok`}
  ]}}
 ],
 prompts:[
  `Which of the responder's messages could risk re-traumatizing the texter? What experience might each response recreate?`,
  `Which moment(s) would you respond to differently? What would you say instead?`
 ],
 placeholder:`Your reflection`,
 cta:`Show the annotations`,
 /* On submit: the same exchange with its annotations behind the highlighted
    words, then the closing feedback. */
 feedback:[
  {h3:`The annotated exchange`},
  {instr:`Select the highlighted words to learn more.`},
  {thread:{ch:'Text', lines:[
    {who:'them', spk:'Texter', t:`i should probably say. i stopped texting here for a while. last year someone sent the police to my place while i was texting with them`},
    {who:'us', spk:'Responder 1', t:`I'm so sorry that happened to you. <mark>I can promise you that's not going to happen tonight.</mark>`,
     annLabel:`Response 1`, ann:`The responder acknowledges the texter's experience, then makes a promise they cannot guarantee. The texter notices this immediately. After an earlier experience involving emergency intervention, another assurance that cannot be kept may make it harder to rebuild trust.`},
    {who:'them', spk:'Texter', t:`you can't really promise that though`},
    {who:'us', spk:'Responder 2', t:`What happened that time? <mark>Had you said something that made them think you were in danger?</mark>`,
     annLabel:`Response 2`, ann:`The texter shared the earlier experience to explain why they may be cautious now. Asking for details shifts attention back to the event itself. Asking whether the texter said something that caused the response may also feel blaming.`},
    {who:'them', spk:'Texter', t:`i don't really want to go back through all of it`},
    {who:'us', spk:'Responder 3', t:`That's okay, but <mark>it would help me understand your situation</mark>. Did they take you to the hospital? How long were you there?`,
     annLabel:`Response 3`, ann:`The responder hears the texter's limit, then continues asking about the earlier event. Framing the questions as a way of helping the responder understand places the responder's needs ahead of the texter's control over what they share.`},
    {who:'them', spk:'Texter', meta:`(a long pause)`, t:`it doesn't matter`},
    {who:'us', spk:'Responder 4', t:`Okay. <mark>Let's put that aside and talk about tonight.</mark> I want to go through some questions with you about how safe you are right now.`,
     annLabel:`Response 4`, ann:`The responder changes direction immediately after the texter withdraws. Exploring current safety may be appropriate, but asking permission before shifting topics would help preserve collaboration and control.`},
    {who:'them', spk:'Texter', t:`ok`}
  ]}},
  {key:[`<strong>The most important moment in the conversation is Response 1.</strong> The texter has offered important information about why reaching out may feel difficult. A transparent response at this point can acknowledge that history, clarify what the responder can and cannot promise, and give the texter more control over what happens next.`]}
 ]},

{sec:6, type:'prose', title:'A trauma-informed alternative', blocks:[
  {p:`Here is one way the responder could handle this interaction using a trauma-informed approach instead.`, lede:true},
  {instr:`Select the highlighted words to learn more.`},
  {thread:{ch:'Text', lines:[
    {who:'them', spk:'Texter', t:`i should probably say. i stopped texting here for a while. last year someone sent the police to my place while i was texting with them`},
    {who:'us', spk:'Responder', t:`Thank you for telling me that. <mark>It makes sense that you'd be cautious about reaching out again.</mark> <mark>I can't promise that emergency help would never be needed.</mark> What I can tell you is that <mark>it is a last resort when someone's safety is at immediate risk</mark>, and I would want to involve you in what was happening as much as possible. <mark>You can decide how much you want to share with me tonight.</mark>`,
     annLabel:`Notice how the responder`,
     ann:[
      `Acknowledges why the texter may be cautious about reaching out`,
      `Gives clear information about the responder's role and the limits of what they can promise`,
      `Reinforces least intrusive practice by describing emergency intervention as a last resort`,
      `Gives the texter control over how much they share`
     ]},
    {who:'them', spk:'Texter', t:`ok. that's more honest than last time at least`},
    {who:'us', spk:'Responder', t:`<mark>Would it be okay if we stayed with what's going on for you tonight?</mark> You can tell me as much or as little as you want.`,
     annLabel:`Notice how the responder`,
     ann:`Asks permission before moving the conversation forward`},
    {who:'them', spk:'Texter', t:`yeah. okay`}
  ]}}
]},

/* ---------------- TOPIC 2 ---------------- */
{sec:7, type:'section', num:'02', kicker:'Topic 2', art:'c',
 title:`Bias in crisis response`, line:`How implicit bias can shape what you hear and how you respond.`},

{sec:7, type:'prose', blocks:[
  {p:`When you answer a 9-8-8 call, you hear a person without seeing them. When you respond to a text, you read their words without hearing their voice. From this limited information, you naturally begin to form an impression of:`, lede:true},
  {cards:{cols:3, tight:true, items:[
    {t:`Who the person is`},
    {t:`How serious their distress may be`},
    {t:`What they may need`}
  ]}},
  {p:`Some of these impressions come from what the person tells you. Others, however, are shaped by your own experiences, expectations, and assumptions.`}
]},

{sec:7, type:'prose', title:'Implicit bias and reflexivity', blocks:[
  {p:`Implicit bias refers to associations and expectations that operate outside our conscious awareness. It develops through our experiences, and is shaped by the sociocultural environments in which we live.`, lede:true},
  {p:`Implicit bias can influence how we interpret a given interaction. It can affect:`},
  {ul:[
    `How seriously you interpret someone's distress`,
    `How you understand anger, silence, or hesitation`,
    `Which questions you ask first`,
    `How quickly you move toward a particular response or intervention`
  ]},
  {p:`Bias is a common part of how people make sense of limited information. As a responder, the important skill is <strong>reflexivity</strong>, which involves:`},
  {cards:{cols:3, items:[
    {t:`Noticing when an interpretation may be shaped by your own assumptions`},
    {t:`Checking your interpretation against what the person has actually said`},
    {t:`Remaining open to other explanations`}
  ]}}
]},

/* ---------------- ACTIVITY: BIAS SPOTLIGHT ---------------- */
{sec:8, type:'section', kicker:'Activity', art:'e', tone:'tranquil',
 title:`Bias spotlight`, line:`Listen to two call openings and notice what stands out to you in each one.`},

{sec:8, type:'prose', title:'How this activity works', blocks:[
  {p:`The purpose of this activity is to give you an opportunity to notice possible biases in your own first impressions. It's important as a responder to be aware of your assumptions and pay attention to how your expectations shape your interpretation of key moments.`, lede:true},
  {p:`In this activity, you will:`},
  {ol:[
    `Listen to two different call openings`,
    `After each one, choose the part of the caller's message that stands out to you most`,
    `Answer based on your first impression, then move on`
  ]},
  {note:`Your answers are not scored. There is no correct choice. The purpose is to notice your own first impressions.`}
]},

{sec:9, type:'mcq', id:'bias1', title:'Opening 1',
 intro:[
  {audio:{label:`Opening 1`, src:AUDIO.opening2, ch:'Voice call', lines:[
    {spk:'Responder', t:`Hello, 9-8-8: Suicide Crisis Helpline.`},
    {spk:'Caller', meta:`(a woman's voice, low and clipped)`, t:`Yeah, hi. I don't really know why I'm calling. My sister said I should. I've been snapping at everyone, I'm not sleeping, my chest is tight all the time and the doctor says there's nothing wrong with me. I'm just tired of all of it.`}
  ]}}
 ],
 prompt:`Which part of this opening stands out to you most?`,
 hint:`Choose the answer that best reflects your first impression.`,
 shared:true,
 sharedFb:`Keep your choice in mind. You will compare it with your response to the next opening.`,
 options:[
  {k:'A', t:`The strain she is under and how it is affecting the people around her`},
  {k:'B', t:`"I'm just tired of all of it" and the possibility that she may be thinking about suicide`},
  {k:'C', t:`Her sleeplessness, chest tightness, and other physical symptoms`}
 ]},

{sec:9, type:'mcq', id:'bias2', title:'Opening 2',
 intro:[
  {audio:{label:`Opening 2`, src:AUDIO.opening1, ch:'Voice call', lines:[
    {spk:'Responder', t:`Hello, 9-8-8: Suicide Crisis Helpline.`},
    {spk:'Caller', meta:`(a man's voice, low and clipped)`, t:`Yeah, hi. I don't really know why I'm calling. My sister said I should. I've been snapping at everyone, I'm not sleeping, my chest is tight all the time and the doctor says there's nothing wrong with me. I'm just tired of all of it.`}
  ]}}
 ],
 prompt:`Which part of this opening stands out to you most?`,
 hint:`Choose the answer that best reflects your first impression.`,
 shared:true,
 sharedFb:`Now compare your two choices. Did the same information stand out to you both times?`,
 options:[
  {k:'A', t:`The strain he is under and how it is affecting the people around him`},
  {k:'B', t:`"I'm just tired of all of it" and the possibility that he may be thinking about suicide`},
  {k:'C', t:`His sleeplessness, chest tightness, and other physical symptoms`}
 ]},

/* The tab that opens first follows the learner's two choices above. */
{sec:9, type:'prose', title:'Activity debrief', blocks:[
  {p:`In these opening moments, the two callers gave you exactly the same information. The only difference was the gender you were asked to infer from their voices.`, lede:true},
  {tabs:[
    {label:`Different parts stood out`, h:`If different parts of the message stood out to you`,
     p:`Consider what expectations may have influenced that shift.`},
    {label:`The same information stood out`, h:`If the same information stood out both times`,
     p:`Consider the assumptions you may still have made about what the information meant or what they needed from the interaction.`}
  ], select:{ids:['bias1','bias2'], same:1, diff:0}},
  {panel:{cls:'blue', p:`The point of the activity is to notice how quickly your interpretation begins to develop.`}}
]},

/* ------------- TOPIC 2, RESUMED AFTER THE ACTIVITY ------------- */
{sec:10, type:'prose', title:'Why do first impressions matter?', blocks:[
  {p:`Research with crisis line responders has demonstrated the importance of addressing implicit bias:`, lede:true},
  {ul:[
    `In one study, responders considered the same caller description presented as either a man or a woman. While their overall judgements of suicide risk were similar, under some conditions they were more likely to favour intervention-oriented responses for a male caller.`,
    `Related research found differences in the patterns of warning signs responders associated with suicide risk depending on the caller's perceived gender.`
  ]},
  {p:`As you saw in Module 1, suicidal distress can be communicated in many ways, including irritability, physical complaints, sleeplessness, or indirect expressions of hopelessness. Expectations about gender can influence which of these signals receive our attention and how we interpret them.`}
]},

{sec:10, type:'prose', title:'First impressions are an equity issue', blocks:[
  {p:`It's important to note here that gender is only one example. Other characteristics can also influence interpretation, such as:`, lede:true},
  {cards:{cols:5, tight:true, items:[
    {t:`Perceived age`},{t:`Accent`},{t:`Language`},{t:`Race`},{t:`Disability`}
  ]}},
  {p:`The same behaviour can take on different meanings depending on who we believe is on the other end of the interaction.`},
  {ul:[
    `A pause might be interpreted as hesitation, resistance, or simply time to think.`,
    `Anger might be understood as distress in one person and hostility in another.`
  ]},
  {key:[`Reflexive practice means noticing these interpretations and returning to what you actually know about the person in front of you.`]}
]},

{sec:10, type:'prose', title:'What you can do', blocks:[
  {p:`You cannot prevent a first impression from forming, but you can be intentional about what happens next. A few consistent practices can help you check your interpretation against what the person is actually telling you:`, lede:true},
  {reveal:{cta:`Reveal the first practice`, more:`Reveal the next`, items:[
    `Stay grounded in the person's words and experiences as they describe them.`,
    `Ask directly about suicide in every interaction. This is a mandatory 9-8-8 practice for every caller and texter, regardless of your first impression.`,
    `Pay attention when an interpretation forms quickly, and take that as a cue to check your assumptions.`,
    `Bring the same care, pacing, permission, and choice to every interaction.`
  ]}},
  {panel:{cls:'blue', p:`Your first impression may shape what you notice first, but these reflexive practices will help you keep that impression open as you continue listening, asking, and learning from the person.`}}
]},

/* ---------------- TOPIC 3 ---------------- */
{sec:11, type:'section', num:'03', kicker:'Topic 3', art:'a',
 title:`Cultural humility and intersectionality`, line:`How ongoing reflection supports relational safety.`},

{sec:11, type:'prose', blocks:[
  {p:`In the previous topic, you learned how your implicit bias can shape what you notice and how you interpret an interaction. To build on this reflexive practice, this topic introduces the concept of <strong>cultural humility</strong>.`, lede:true},
  {p:`Two related concepts help frame this practice:`},
  {acc:[
    {q:`Cultural safety`,
     a:`Cultural safety was first articulated in the 1990s by Irihapeti Ramsden, a Māori nurse scholar, and her colleagues in Aotearoa New Zealand in response to inequitable health outcomes for Māori people. It draws attention to power within the relationship between a provider and the person receiving care. Cultural safety is determined by the person receiving the service and by whether they experience the interaction as respectful and safe.`},
    {q:`Cultural humility`,
     a:`Cultural humility was introduced by Melanie Tervalon and Jann Murray-García in 1998. It describes an ongoing practice of self-reflection, attention to power imbalances, and building respectful partnerships with the people you support.`}
  ]},
  {p:`In 9-8-8 interactions, cultural humility is part of what you practise as a responder. Cultural safety is what you are working to support, and it is the caller or texter who ultimately determines whether they experience it.`},
  {panel:{cls:'blue', p:`Both concepts contribute to relational safety, the sense of trust and security a person experiences within the interaction.`}}
]},

{sec:11, type:'prose', title:'Cultural humility in practice', blocks:[
  {p:`Cultural humility asks you to approach each person with curiosity about their experience. It is not about memorizing facts about groups.`, lede:true},
  {p:`While knowledge about cultures, communities, and identities can provide useful context, it cannot tell you what a particular person believes, values, or needs in a given moment.`},
  {p:`As a responder, you can practise cultural humility in an interaction by:`},
  {ul:[
    `Approaching the person as the expert on their own experience`,
    `Asking when identity is relevant instead of filling the gaps yourself`,
    `Explaining why you are asking about identity`,
    `Letting the caller or texter decide what is relevant and how much they want to share`,
    `Noticing when your own background, language, assumptions, or comfort may be shaping how you respond`
  ]},
  {note:`The 9-8-8 resource <a href="https://portal.988.ca/" target="_blank" rel="noopener">Asking Callers and Texters About Their Identities</a> provides guidance for asking about identity respectfully, including how to explain why you are asking and how to respond if a question does not land as intended.`}
]},

{sec:11, type:'prose', title:'Intersectionality', blocks:[
  {p:`Staying curious about the whole person also means recognizing that people experience the world through more than one aspect of identity.`, lede:true},
  {p:`<strong>Intersectionality</strong> describes how systems of oppression can overlap and shape a person's experiences in interconnected ways. These systems include:`},
  {cards:{cols:3, tight:true, items:[
    {t:`Racism`},{t:`Sexism`},{t:`Ableism`},{t:`Anti-2SLGBTQIA+ discrimination`},{t:`Class-based disadvantages`}
  ]}},
  {p:`For you as a 9-8-8 responder, this means that callers' and texters' experiences of safety, discrimination, and support can be complex and multifaceted.`},
  {p:`<strong>For example:</strong> a person may have received care that affirmed their queerness while also experiencing racism within the same service. They may have felt understood in one part of their identity and unseen in another.`, indent:true},
  {panel:{cls:'blue', p:`Cultural humility helps you stay open to that complexity and allow the person to tell you which parts of their experience matter most in the interaction at hand.`}}
]},

/* ---------------- ACTIVITY: NAMING SOCIAL REALITIES ---------------- */
{sec:12, type:'section', kicker:'Activity', art:'e', tone:'tranquil',
 title:`Naming social realities`, line:`Read three examples and choose the reply that takes the person's experience seriously in each one.`},

{sec:12, type:'prose', title:'How this activity works', blocks:[
  {p:`Cultural humility also includes taking seriously the social realities a person identifies as part of their distress.`, lede:true},
  {p:`When someone describes racism, discrimination, or another form of injustice, acknowledging what they are experiencing directly can help them feel heard and understood. Responses that minimize the experience, explain it away, or move quickly to solutions can add to the sense of dismissal the person may already be experiencing.`},
  {p:`In this activity, you will review three examples of what this dynamic can look like in conversation. In the first, discrimination sits alongside the person's distress. In the second and third, the situation itself is the crisis.`},
  {p:`For each example, you will:`},
  {ol:[
    `Read the exchange`,
    `Choose the response that best recognizes what the person is describing and stays with its impact`
  ]}
]},

{sec:13, type:'mcq', title:'Example 1 (text)',
 intro:[
  {thread:{ch:'Text', lines:[
    {who:'them', spk:'Texter', t:`the thing is my manager keeps "forgetting" my name. and last week he asked where i'm really from, in front of everyone`},
    {who:'them', spk:'Texter', t:`i said something and now i'm the one with the attitude problem`},
    {who:'them', spk:'Texter', t:`i'm so tired`}
  ]}}
 ],
 prompt:`Which reply best recognizes the texter's experience as a legitimate source of distress?`,
 hint:`Select the best answer.`,
 options:[
  {k:'A', t:`"That sounds like a really stressful workplace, and I can hear how worn down you are by all of it. Have you thought about raising it with HR, or about whether this job is still worth staying at?"`, correct:false,
   fb:`This response recognizes that the situation is difficult, then moves quickly toward solving it. Describing the experience as general workplace stress also misses an important part of what the texter has shared: they feel singled out because of assumptions about who they are.`},
  {k:'B', t:`"It sounds like you feel singled out because of where your manager assumes you're from, and then blamed when you speak up about it. That sounds exhausting. What's it been like dealing with that at work?"`, correct:true,
   fb:`This response stays close to the texter's description of what is happening and acknowledges its impact. The question gives the texter space to explain the experience in their own words.`},
  {k:'C', t:`"It's possible he doesn't realize how that comes across. Some people are just awkward about names and don't mean anything by it. Try not to let it get under your skin, if you can help it at all."`, correct:false,
   fb:`This response shifts attention toward possible explanations for the manager's behaviour and minimizes its impact on the texter. The texter has described feeling singled out and blamed, so explaining the behaviour away may reinforce the sense that their experience is being dismissed.`}
 ]},

{sec:13, type:'mcq', title:'Example 2 (voice)',
 intro:[
  {audio:{label:`Example 2`, ch:'Voice call', lines:[
    {spk:'Caller', t:`So I got a letter today. My rent's going up four hundred dollars in January. I already work two jobs. I've done the math a bunch of times and it just doesn't work. I don't drink, I don't waste anything, I've done everything you're supposed to do, and I still can't keep a roof over my kids' heads.`},
    {spk:'Caller', meta:`(pause)`, t:`I don't know what I'm supposed to do anymore.`}
  ]}}
 ],
 prompt:`Which reply best recognizes the caller's situation as a legitimate source of distress?`,
 hint:`Select the best answer.`,
 options:[
  {k:'A', t:`"You're working two jobs, you've done everything you're supposed to, and the numbers still don't work. That's not a failing on your part. How long have you been carrying this on your own?"`, correct:true,
   fb:`This response reflects the situation as the caller described it and stays with the impact it is having on them. The question creates space for the caller to say more before the conversation moves toward possible resources or next steps.`},
  {k:'B', t:`"That's a lot to carry, and I can hear it. Did you know there are tenant support services and rent assistance programs that might be able to help with this? Would you like me to look up what's available in your area?"`, correct:false,
   fb:`This response takes the situation seriously and offers practical support. At this point, however, the caller has only just described what they are carrying. Moving immediately to resources may leave little space for that experience to be heard first.`},
  {k:'C', t:`"Let's set the rent aside for a moment, if that's okay. I'm hearing a lot of stress in your voice, and I want to make room for that. Can you tell me more about how you're feeling right now?"`, correct:false,
   fb:`This response makes room for the caller's feelings, but separates those feelings from the circumstances they have just described. The rent increase and financial pressure are part of the distress, so acknowledging that context helps the caller feel understood as a whole person.`}
 ]},

{sec:13, type:'mcq', title:'Example 3 (voice)',
 intro:[
  {audio:{label:`Example 3`, ch:'Voice call', lines:[
    {spk:'Caller', t:`I went to emerg last night because the pain in my side got so bad I couldn't stand up. I sat there seven hours. When they finally called me in, the nurse asked how much I had to drink and if I was there for pills. I don't even drink man. They took one look at me and decided who I am. I've dealt with that my whole life.`},
    {spk:'Caller', meta:`(pause)`, t:`So anyway, I left the hospital. My pain is still there. But I'm not going back to that place. I'd rather sit here with it.`}
  ]}}
 ],
 prompt:`Which reply best recognizes what the caller experienced as a legitimate source of distress?`,
 hint:`Select the best answer.`,
 options:[
  {k:'A', t:`"That sounds so frustrating, and I'm sorry you had to sit there that long. Emergency departments are stretched thin right now, and some of those questions are routine for everyone who comes in. I'd really encourage you to go back and get that looked at."`, correct:false,
   fb:`This response focuses on getting the caller medical attention, but explains away the experience they have just described. That may leave the caller feeling that the discrimination they experienced has been minimized.`},
  {k:'B', t:`"It sounds like the pain is the main thing right now, so let's focus on that and make sure you're okay. Have you thought about calling 811 to talk to a nurse, or trying a walk-in clinic instead of going back there?"`, correct:false,
   fb:`This response addresses the unresolved pain, which matters, but moves directly into problem-solving. The caller has also described an experience of being judged and treated differently, and acknowledging that experience is important before exploring what they want to do next.`},
  {k:'C', t:`"You went in because the pain was so intense you couldn't stand up, and you came away feeling judged instead of cared for. And you said this is something you've dealt with before? How are you feeling about getting help for the pain?"`, correct:true,
   fb:`This response acknowledges both parts of what the caller has shared: the experience of discrimination and the unresolved physical pain. It stays with the caller's own account and opens space to explore what support would feel acceptable and safe. Once the caller feels heard, the responder can continue exploring options for the ongoing pain in line with the standard operating procedures.`}
 ]},

/* ---------------- TOPIC 4 ---------------- */
{sec:15, type:'section', num:'04', kicker:'Topic 4', art:'d',
 title:`Offering culturally specific services`, line:`How to offer a resource without losing the connection.`},

{sec:15, type:'prose', blocks:[
  {p:`You just learned that cultural humility includes listening for the kinds of support that feel meaningful and relevant to the person on the other end. Sometimes a person may want support connected to their culture, language, community, or lived experience. This topic will cover how to navigate this situation in a collaborative, trauma-informed, and culturally humble way.`, lede:true},
  {p:`Offering culturally specific resources can be part of collaborative practice, but the way you introduce them is important.`},
  {p:`They should be part of a broader approach that helps you stay connected to the person and ensure they retain choice over what happens next.`},
  {panel:{cls:'blue', p:`If the caller or texter identifies that a culturally specific resource may be helpful for their situation, <a href="https://portal.988.ca/" target="_blank" rel="noopener">the 9-8-8 resource directory</a> includes a range of services that may meet their specific needs.`}}
]},

{sec:15, type:'prose', title:'Offering resources collaboratively', blocks:[
  {p:`A culturally specific resource should be offered as part of a collaborative approach, with the person's interest and choice guiding what happens next. The following principles can help guide these interactions:`, lede:true},
  {acc:[
    {q:`Preserve the connection`,
     a:`9-8-8 cannot currently transfer a call directly to an external service, so avoid ending the interaction simply because another resource has been offered.`},
    {q:`Keep the choice with the person`,
     a:`Research with people who use 9-8-8 has highlighted the importance of choice, particularly for people from equity-denied communities who may have previous experiences of being passed between services.`}
  ]}
]},

{sec:15, type:'prose', title:'The Hope for Wellness Helpline', blocks:[
  {p:`One example of culturally specific support is the <a href="https://www.hopeforwellness.ca/" target="_blank" rel="noopener">Hope for Wellness Helpline</a>, which provides support to Indigenous people across Canada, including First Nations, Inuit, and Métis people.`, lede:true},
  {ul:[
    `Counsellors are available 24 hours a day, 7 days a week, by phone at 1-855-242-3310 and through online chat at hopeforwellness.ca.`,
    `Support is available in English and French.`,
    `Phone support can also be requested in Cree, Ojibway, and Inuktitut.`,
    `Counsellors who speak these languages may not be available at all times, so the person may need to call to find out when support is available.`,
    `Counsellors can also help people connect with wellness supports in their community.`
  ]},
  {note:`Access information can change. Check the current listing in the 9-8-8 resource directory before providing it, and document the resource information you share as you would for any referral.`}
]},

/* ---------------- ACTIVITY: OFFERING HOPE FOR WELLNESS ---------------- */
